<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Menu Online</title>

    <style>
		body {
			font-family: 'Inter', Arial, sans-serif;
			margin: 0;
			height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;

			/* 🔥 SFONDO IMMAGINE */
			background: url("/static/background.png") no-repeat center center fixed;
			background-size: cover;
		}
		body::before {
			content: "";
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.35); /* leggero scurimento */
			backdrop-filter: blur(1px);
			z-index: -1;
		}


        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            width: 100%;
            max-width: 410px;

            /* ombra elegante */
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

		.logo {
			width: 240px;           /* aumentato da 150px */
			max-width: 80%;         /* evita che superi la card su schermi piccoli */
			margin-bottom: 20px;    
		}


        h2 {
            margin: 5px 0 25px 0;
            color: #003366;
            font-size: 26px;
            font-weight: 600;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #003366;
        }

        input {
            width: 70%;
            padding: 12px 14px;
            margin-top: 5px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #c9d6e2;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.2);
        }

        .btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;

            background: linear-gradient(to right, #004aad, #007bff);
            color: white;
            font-size: 17px;
            font-weight: 600;

            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.25s;
        }

        .btn:hover {
            transform: scale(1.03);
        }

        .forgot-password {
            margin-top: 12px;
            font-size: 14px;
            color: #007bff;
            text-decoration: none;
            transition: 0.2s;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .download-app {
            margin-top: 25px;
            padding: 12px 20px;
            text-align: center;
            font-size: 16px;

            background: #ffffff;
            color: #004aad;
            font-weight: 600;

            border-radius: 10px;
            border: 2px solid #004aad;
            text-decoration: none;

            transition: 0.25s;
        }

        .download-app:hover {
            background: #004aad;
            color: white;
            transform: scale(1.05);
        }
		.error-box {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

    </style>
</head>

<body>

    <div class="login-card">

        <!-- Logo AlphaSystem -->
        <img src="/static/logo1.png" 
			 alt="AlphaSystem Logo" 
			 class="logo">
			 
		{% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}




        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn">Accedi</button>
            <a href="#" class="forgot-password">Hai dimenticato la password?</a>
        </form>
    </div>

</body>
</html>
