<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Menu Online</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: url("/static/background.png") no-repeat center center fixed;
            background-size: cover;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(1px);
            z-index: -1;
        }
        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }
        .logo {
            width: 240px;
            max-width: 80%;
            margin-bottom: 20px;
        }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 14px; color: #003366; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 5px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #c9d6e2;
            outline: none;
            transition: border .2s, box-shadow .2s;
        }
        input:focus { border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,.2); }
        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: linear-gradient(to right, #004aad, #007bff);
            color: white;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: .25s;
        }
        .btn:hover { transform: scale(1.03); }
        .google-btn { background: white; color: #004aad; border: 2px solid #004aad; }
        .google-btn.disabled { opacity: .55; pointer-events: none; }
        .account-links { margin-top: 17px; font-size: 14px; color: #52657a; }
        .account-links a { color: #007bff; font-weight: 600; text-decoration: none; }
        .account-links a:hover { text-decoration: underline; }
        .google-note { margin: 8px 0 0; color: #6b7785; font-size: 12px; }
        .error-box {
            background: rgba(220, 53, 69, .12);
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        @media (max-width: 480px) {
            .login-card { padding: 30px 22px; }
            .logo { width: 210px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/static/logo1.png" alt="AlphaSystem Logo" class="logo">
        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Accedi</button>
        </form>
        <a class="btn google-btn{% if not google_enabled %} disabled{% endif %}" href="{{ url_for('auth_google') }}">Continua con Google</a>
        {% if not google_enabled %}<p class="google-note">Accesso Google in configurazione.</p>{% endif %}
        <p class="account-links">Non hai un account? <a href="{{ url_for('register') }}">Registrati</a></p>
    </div>
    {% include '_legal_footer.html' %}
</body>
</html>
