<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='alpha-menu-icon-am.svg') }}" type="image/svg+xml">
    <title>Login - Menu Online</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background: url("/static/background.png") no-repeat center center fixed;
            background-size: cover;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(1px);
            z-index: -1;
        }
        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }
        .logo {
            display: block;
            width: 132px;
            max-width: 80%;
            margin: 0 auto 20px;
        }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 14px; color: #003366; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 5px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #c9d6e2;
            outline: none;
            transition: border .2s, box-shadow .2s;
        }
        input:focus { border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,.2); }
        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: linear-gradient(to right, #004aad, #007bff);
            color: white;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: .25s;
        }
        .btn:hover { transform: scale(1.03); }
        .provider-btn { background: white; color: #263248; border: 1px solid #c9d6e2; display:flex;align-items:center;justify-content:center;gap:10px; }
        .provider-mark{width:19px;height:19px;flex:0 0 auto}
        .apple-btn { background:#000; color:#fff; border-color:#000; }
        .provider-btn.disabled { opacity: .55; pointer-events: none; }
        .account-links { margin-top: 17px; font-size: 14px; color: #52657a; }
        .account-links a { color: #007bff; font-weight: 600; text-decoration: none; }
        .account-links a:hover { text-decoration: underline; }
        .google-note { margin: 8px 0 0; color: #6b7785; font-size: 12px; }
        .error-box {
            background: rgba(220, 53, 69, .12);
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        @media (max-width: 480px) {
            body { justify-content: flex-start; padding: 14px; }
            .login-card { padding: 28px 20px; }
            .logo { width: 116px; }
            .btn { min-height: 46px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="{{ url_for('static', filename='alpha-menu-icon-am.svg') }}" alt="Alpha Menu" class="logo">
        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Accedi</button>
        </form>
        <a class="btn provider-btn google-btn{% if not google_enabled %} disabled{% endif %}" href="{{ url_for('auth_google') }}"><svg class="provider-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.32 2.98-7.41Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.36l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.77-5.61-4.14H3.04v2.62A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.39 13.92A6 6 0 0 1 6.08 12c0-.67.12-1.32.31-1.92V7.46H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.54l3.35-2.62Z"/><path fill="#EA4335" d="M12 5.94c1.47 0 2.79.51 3.83 1.5l2.87-2.88A9.63 9.63 0 0 0 12 2a10 10 0 0 0-8.96 5.46l3.35 2.62C7.18 7.71 9.39 5.94 12 5.94Z"/></svg><span>Continua con Google</span></a>
        {% if not google_enabled %}<p class="google-note">Accesso Google in configurazione.</p>{% endif %}
        <a class="btn provider-btn apple-btn{% if not apple_enabled %} disabled{% endif %}" href="{{ url_for('auth_apple') }}" aria-label="Continua con Apple"><svg class="provider-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09ZM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25Z"/></svg><span>Continua con Apple</span></a>
        {% if not apple_enabled %}<p class="google-note">Accesso Apple in configurazione.</p>{% endif %}
        <p class="account-links">Non hai un account? <a href="{{ url_for('register') }}">Registrati</a></p>
    </div>
    {% include '_legal_footer.html' %}
</body>
</html>
