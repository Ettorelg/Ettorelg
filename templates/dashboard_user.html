<!doctype html>
<html lang="it">
<head>
  <link rel="icon" href="{{ url_for('static', filename='alpha-menu-favicon.png') }}" type="image/png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/app-icon-192.png" />
  <title>Dashboard</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#0f1a2e; --text:#e7ecff; --muted:#aab4d6;
      --border:rgba(255,255,255,.12); --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
      --sidebar-w:280px; --sidebar-collapsed:78px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    .app{display:flex;min-height:100vh}
    .sidebar{position:sticky;top:0;height:100vh;width:var(--sidebar-w);background:var(--panel);
      border-right:1px solid var(--border);box-shadow:var(--shadow);transition:width .2s ease;overflow-x:hidden;overflow-y:auto;scrollbar-color:rgba(255,255,255,.28) transparent;scrollbar-width:thin}
    .sidebar.collapsed{width:var(--sidebar-collapsed)}
    .sidebar.collapsed .sb-top{justify-content:center;padding:14px 10px}
    .sidebar.collapsed .sb-top .logo{display:none}
    .sidebar.collapsed .toggle{margin-left:0;background:rgba(110,168,254,.22);border-color:rgba(110,168,254,.5);box-shadow:0 5px 14px rgba(0,0,0,.2)}
    .sidebar.collapsed .sb-nav{padding:10px 12px}
    .sidebar.collapsed .nav-item{justify-content:center;padding:12px 8px}
    .sb-top{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--border)}
    .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#4666b6,#27345e);flex:0 0 auto;display:grid;place-items:center;overflow:hidden;color:#fff;font-size:12px;font-weight:750;letter-spacing:.04em}
    .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
    .titles{min-width:0}
    .titles strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .titles span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .toggle{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
      background:rgba(255,255,255,.05);color:var(--text);cursor:pointer}
    .mobile-menu-toggle,.mobile-menu-backdrop{display:none}
    .sb-nav{padding:10px;display:flex;flex-direction:column;gap:6px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:var(--text);
      text-decoration:none;border:1px solid transparent;background:transparent;cursor:pointer}
    .nav-item:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.06)}
    .nav-item.active{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.12)}
    .icon{width:26px;height:26px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);flex:0 0 auto}
    .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
    .sidebar.collapsed .label, .sidebar.collapsed .titles{display:none}
    .main{flex:1;min-width:0;padding:14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(255,255,255,.03);box-shadow:var(--shadow)}
    .topbar h1{margin:0;font-size:16px}
    .topbar-actions{display:flex;align-items:center;gap:10px}
    .pill{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04)}
    .expiry-banner{display:none;margin-top:14px;padding:15px 17px;border:1px solid rgba(255,190,75,.6);border-radius:var(--radius);background:linear-gradient(90deg,rgba(255,180,60,.2),rgba(255,90,90,.12));color:#fff0c5;font-weight:720;box-shadow:var(--shadow)}.expiry-banner.urgent{border-color:rgba(255,110,110,.75);color:#ffe0e0}.expiry-banner a{display:inline-flex;margin-left:12px;color:#161007;background:#ffc857;border-radius:8px;padding:7px 10px;text-decoration:none;font-weight:900}
    .content{width:min(100%,1120px);margin:12px auto 0;border:1px solid var(--border);border-radius:var(--radius);
      background:rgba(255,255,255,.03);box-shadow:var(--shadow);padding:14px;min-height:320px}
    .loading{opacity:.65}
    .error{padding:10px;border:1px solid rgba(255,80,80,.4);background:rgba(255,80,80,.12);border-radius:12px}
    .dashboard-notice{position:fixed;top:18px;left:50%;z-index:1200;transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:min(560px,calc(100vw - 28px));padding:16px 18px;border:2px solid #72dfa0;border-radius:14px;background:#123d2b;color:#f4fff7;box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:16px;font-weight:750}
    .dashboard-notice.error{border-color:#ff8c8c;background:#57252b;color:#fff0f0}.dashboard-notice[hidden]{display:none}.dashboard-notice-text{flex:1}.dashboard-notice-close{flex:0 0 auto;border:0;background:transparent;color:inherit;font-size:24px;line-height:1;cursor:pointer}

    @media(max-width:760px){
      body{overflow-x:hidden}body.mobile-menu-open{overflow:hidden}.app{display:block;min-height:100vh}.sidebar,.sidebar.collapsed{position:sticky;top:0;z-index:20;width:100%;height:auto;max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--border)}
      body.mobile-menu-open .sidebar{z-index:26}
      .sb-top,.sidebar.collapsed .sb-top{justify-content:flex-start;padding:9px 10px}.logo,.sidebar.collapsed .sb-top .logo{display:grid;width:38px;height:38px;border-radius:10px}.titles,.sidebar.collapsed .titles{display:block;flex:1}.titles strong{font-size:13px}.toggle{display:none}
      .mobile-menu-toggle{display:grid;place-items:center;flex:0 0 auto;width:42px;height:42px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.06);color:var(--text);font-size:23px;cursor:pointer}
      .mobile-menu-backdrop{display:block;position:fixed;inset:57px 0 0;z-index:24;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
      .mobile-menu-backdrop.open{opacity:1;visibility:visible;pointer-events:auto}
      .sidebar .sb-nav,.sidebar.collapsed .sb-nav{position:fixed;top:57px;bottom:0;left:0;z-index:25;display:flex;flex-direction:column;gap:5px;width:min(84vw,320px);padding:14px 12px max(18px,env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;background:var(--panel);border-right:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(-105%);visibility:hidden;pointer-events:none;transition:transform .22s ease,visibility .22s}
      .sidebar .sb-nav.open,.sidebar.collapsed .sb-nav.open{transform:translateX(0);visibility:visible;pointer-events:auto}
      .sidebar .nav-item,.sidebar.collapsed .nav-item{justify-content:flex-start;flex:0 0 auto;min-height:48px;padding:9px 12px;gap:12px}.icon{width:30px;height:30px;border-radius:8px}.label,.sidebar.collapsed .label{display:block;max-width:none;font-size:15px}
      .main{width:100%;padding:9px}.topbar{padding:10px 11px;border-radius:12px;box-shadow:none}.topbar h1{font-size:15px}.topbar-actions{gap:6px}.pill{display:none}
      .content{margin-top:9px;padding:11px;min-height:260px;border-radius:12px;box-shadow:none;overflow:hidden}.content input:not([type=checkbox]):not([type=radio]):not([type=color]),.content select,.content textarea{max-width:100%;font-size:16px}.content button,.content .btn{min-height:42px;touch-action:manipulation}.content img{max-width:100%}
      .dashboard-notice{top:68px;padding:13px 15px;font-size:15px}
    }
  </style>
</head>
<body>
  <div class="dashboard-notice" id="dashboardNotice" role="status" aria-live="polite" hidden><span id="dashboardNoticeText" class="dashboard-notice-text"></span><button id="dashboardNoticeClose" class="dashboard-notice-close" type="button" aria-label="Chiudi avviso">×</button></div>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sb-top">
        <div class="logo" id="shopLogo">
          <span id="shopLogoFallback">AM</span>
          <img id="shopLogoImage" alt="Logo del punto vendita" hidden />
        </div>
        <div class="titles">
          <strong id="shopName">Alpha Menu</strong>
          <span>{{ username }}</span>
        </div>
        <button class="toggle" id="sidebarToggle" type="button" onclick="toggleSidebar()" title="Riduci menu" aria-label="Riduci menu" aria-expanded="true">☰</button>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Apri menu" aria-controls="nav" aria-expanded="false">☰</button>
      </div>

      <nav class="sb-nav" id="nav">
        <button class="nav-item active" data-section="home"><div class="icon">🏠</div><div class="label">Home</div></button>

        <button class="nav-item" data-section="prodotti" data-requires-shop="1"><div class="icon">🧾</div><div class="label">Prodotti</div></button>
        <button class="nav-item" data-section="varianti" data-requires-shop="1"><div class="icon">➕</div><div class="label">Varianti</div></button>
        <button class="nav-item" data-section="categorie" data-requires-shop="1"><div class="icon">📁</div><div class="label">Categorie</div></button>
        <button class="nav-item" data-section="formati" data-requires-shop="1" data-module="pizzeria" {% if not pizzeria_active %}hidden{% endif %}><div class="icon">📐</div><div class="label">Formati</div></button>
        <button class="nav-item" data-section="attivita"><div class="icon">🏪</div><div class="label">Negozio e orari</div></button>
        <button class="nav-item" data-section="menu_online" data-requires-shop="1"><div class="icon">📱</div><div class="label">Menu pubblico</div></button>
        <button class="nav-item" data-section="ordini" data-requires-shop="1" data-module="orders" {% if not orders_active %}hidden{% endif %}><div class="icon">🛎️</div><div class="label">Ordini</div></button>
        <button class="nav-item" data-section="clienti" data-requires-shop="1" data-module="orders" {% if not orders_active %}hidden{% endif %}><div class="icon">👥</div><div class="label">Clienti</div></button>
        <button class="nav-item" data-section="pizzeria" data-requires-shop="1" data-module="pizzeria" {% if not pizzeria_active %}hidden{% endif %}><div class="icon">🍕</div><div class="label">Pizzeria</div></button>

        <button class="nav-item" data-section="lingue" data-requires-shop="1"><div class="icon">🌐</div><div class="label">Lingue</div></button>
        <button class="nav-item" data-section="statistiche" data-requires-shop="1" data-module="analytics" {% if not orders_active and not pizzeria_active %}hidden{% endif %}><div class="icon">📊</div><div class="label">Statistiche</div></button>
        <button class="nav-item" data-section="licenze"><div class="icon">🔐</div><div class="label">Licenze</div></button>
        <button class="nav-item" data-section="account"><div class="icon">👤</div><div class="label">Account</div></button>
      </nav>

    </aside>
    <div class="mobile-menu-backdrop" id="mobileMenuBackdrop" aria-hidden="true"></div>

    <main class="main">
      <div class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-actions">
          <div class="pill">Utente: {{ username }}</div>
        </div>
      </div>
      <div id="expiryBanner" class="expiry-banner" role="status"></div>

      <div id="content" class="content"></div>
      {% include '_legal_footer.html' %}
    </main>
  </div>

  <script>
    const csrfToken = {{ csrf_token()|tojson }};
    const nativeFetch = window.fetch.bind(window);
    window.fetch = (input, options = {}) => {
      const method = String(options.method || 'GET').toUpperCase();
      if (['POST','PUT','PATCH','DELETE'].includes(method)) {
        const headers = new Headers(options.headers || {});
        headers.set('X-CSRF-Token', csrfToken);
        options = {...options, headers};
      }
      return nativeFetch(input, options);
    };
    const sidebar = document.getElementById('sidebar');
    const dashboardNotice = document.getElementById('dashboardNotice');
    let dashboardNoticeTimer;
    window.showDashboardNotice = (message, error = false) => {
      if (!message) return;
      clearTimeout(dashboardNoticeTimer);
      document.getElementById('dashboardNoticeText').textContent = message;
      dashboardNotice.classList.toggle('error', Boolean(error));
      dashboardNotice.setAttribute('role', error ? 'alert' : 'status');
      dashboardNotice.hidden = false;
      dashboardNoticeTimer = setTimeout(() => { dashboardNotice.hidden = true; }, error ? 8000 : 5500);
    };
    window.observeDashboardMessage = element => {
      if (!element) return;
      let previous = element.textContent.trim();
      new MutationObserver(() => {
        const message = element.textContent.trim();
        if (message && message !== previous) {
          window.showDashboardNotice(message, /errore|non riuscit|impossibile|non valid|inserisci|seleziona/i.test(message));
        }
        previous = message;
      }).observe(element, {childList:true, characterData:true, subtree:true});
    };
    document.getElementById('dashboardNoticeClose').addEventListener('click', () => {
      clearTimeout(dashboardNoticeTimer);
      dashboardNotice.hidden = true;
    });
    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    const pageTitle = document.getElementById('pageTitle');
    const shopName = document.getElementById('shopName');
    const shopLogoImage = document.getElementById('shopLogoImage');
    const shopLogoFallback = document.getElementById('shopLogoFallback');
    let shopConfigured = {{ 'true' if shop_configured else 'false' }};
    const licensePlan = {{ license_plan|tojson }};
    const professionalSections = new Set(['lingue', 'statistiche']);
    const expiryBanner = document.getElementById('expiryBanner');
    async function showExpiryWarning(){
      try {
        const response = await fetch('/api/licenza');
        if (!response.ok) return;
        const data = await response.json();
        const license = data.item;
        if (!license || license.stato !== 'attiva' || license.giorni_rimanenti < 0 || license.giorni_rimanenti > 14) return;
        const days = license.giorni_rimanenti;
        const isTrial = Boolean(license.in_prova);
        expiryBanner.classList.toggle('urgent', days <= 3);
        expiryBanner.innerHTML = '⚠ <strong>' + (days === 0 ? (isTrial ? 'La tua prova gratuita termina oggi.' : 'La tua licenza scade oggi.') : (isTrial ? 'La tua prova gratuita termina tra ' : 'La tua licenza scade tra ') + days + ' giorni.') + '</strong> ' + (isTrial ? 'Scegli il piano per continuare senza interruzioni.' : 'Rinnova ora per non interrompere il servizio.') + '<a href="' + (isTrial ? '/pagamento?scelta=1' : '/pagamento?rinnovo=1') + '">' + (isTrial ? 'Scegli il tuo piano' : 'Rinnova ora') + '</a>';
        expiryBanner.style.display = 'block';
      } catch (_) {}
    }
    showExpiryWarning();
    const shopRequiredSections = new Set(['prodotti', 'varianti', 'categorie', 'formati', 'sottocategorie', 'allergeni', 'menu_online', 'ordini', 'clienti', 'pizzeria', 'qrcode', 'anteprima', 'lingue', 'statistiche']);

    function syncShopLocks(){
      // Tutte le sezioni restano visibili e selezionabili. loadSection guida
      // l'utente a Negozio o Licenze quando manca un requisito.
      for (const btn of nav.querySelectorAll('[data-section]')) {
        btn.disabled = false;
        btn.removeAttribute('aria-disabled');
        btn.title = '';
      }
      const ordersActive = {{ 'true' if orders_active else 'false' }};
      const pizzeriaActive = {{ 'true' if pizzeria_active else 'false' }};
      for (const btn of nav.querySelectorAll('[data-module="orders"]')) btn.hidden = !ordersActive;
      for (const btn of nav.querySelectorAll('[data-module="pizzeria"]')) btn.hidden = !pizzeriaActive;
      for (const btn of nav.querySelectorAll('[data-module="analytics"]')) btn.hidden = !(ordersActive || pizzeriaActive);
    }

    window.loadShopBranding = async function loadShopBranding(){
      try {
        const response = await fetch('/api/negozio');
        if (!response.ok) return;
        const data = await response.json();
        const shop = data.item || {};
        shopConfigured = Boolean(shop.id);
        const ordersActive = Boolean(shop.ordini_attivi || shop.ordini_tavolo_attivi);
        const pizzeriaActive = Boolean(shop.modulo_pizzeria_attivo);
        for (const btn of nav.querySelectorAll('[data-module="orders"]')) btn.hidden = !ordersActive;
        for (const btn of nav.querySelectorAll('[data-module="pizzeria"]')) btn.hidden = !pizzeriaActive;
        for (const btn of nav.querySelectorAll('[data-module="analytics"]')) btn.hidden = !(ordersActive || pizzeriaActive);
        syncShopLocks();
        const name = (shop.nome || 'Alpha Menu').trim();
        shopName.textContent = name;
        shopLogoFallback.textContent = name.split(/\s+/).slice(0, 2).map(word => word[0]).join('').toUpperCase() || 'AM';

        if (shop.logo_url) {
          shopLogoImage.src = shop.logo_url;
          shopLogoImage.hidden = false;
          shopLogoFallback.hidden = true;
        } else {
          shopLogoImage.hidden = true;
          shopLogoFallback.hidden = false;
        }
      } catch (_) {
        // Mantiene il fallback se i dati del negozio non sono disponibili.
      }
    };

    shopLogoImage.addEventListener('error', () => {
      shopLogoImage.hidden = true;
      shopLogoFallback.hidden = false;
    });

    const titles = {
      home: "Home",
      prodotti: "Prodotti",
      varianti: "Varianti per formato",
      categorie: "Categorie",
      allergeni: "Gestione allergeni",
      attivita: "Negozio e orari",
      menu_online: "QR Code e anteprima",
      ordini: "Ordini",
      clienti: "Clienti",
      pizzeria: "Pizzeria",
      lingue: "Lingue e traduzioni",
      statistiche: "Statistiche",
      licenze: "Licenze",
      account: "Account"
    };

    const sidebarToggle = document.getElementById('sidebarToggle');
    const mobileMenuToggle = document.getElementById('mobileMenuToggle');
    const mobileMenuBackdrop = document.getElementById('mobileMenuBackdrop');
    const mobileMenuQuery = window.matchMedia('(max-width:760px)');
    function setMobileMenuOpen(open){
      const isOpen = Boolean(open && mobileMenuQuery.matches);
      nav.classList.toggle('open', isOpen);
      mobileMenuBackdrop.classList.toggle('open', isOpen);
      document.body.classList.toggle('mobile-menu-open', isOpen);
      mobileMenuToggle.setAttribute('aria-expanded', String(isOpen));
      mobileMenuToggle.setAttribute('aria-label', isOpen ? 'Chiudi menu' : 'Apri menu');
      mobileMenuToggle.textContent = isOpen ? '×' : '☰';
      nav.inert = mobileMenuQuery.matches && !isOpen;
    }
    mobileMenuToggle.addEventListener('click', () => setMobileMenuOpen(!nav.classList.contains('open')));
    mobileMenuBackdrop.addEventListener('click', () => { setMobileMenuOpen(false); mobileMenuToggle.focus(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && nav.classList.contains('open')) {
        setMobileMenuOpen(false);
        mobileMenuToggle.focus();
      }
    });
    mobileMenuQuery.addEventListener('change', () => setMobileMenuOpen(false));
    setMobileMenuOpen(false);
    function syncSidebarToggle(){
      const collapsed = sidebar.classList.contains('collapsed');
      sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
      sidebarToggle.setAttribute('aria-label', collapsed ? 'Espandi menu' : 'Riduci menu');
      sidebarToggle.title = collapsed ? 'Espandi menu' : 'Riduci menu';
      sidebarToggle.textContent = collapsed ? '›' : '‹';
    }
    function toggleSidebar(){
      sidebar.classList.toggle('collapsed');
      syncSidebarToggle();
      localStorage.setItem('sb_collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
    }
    (function restore(){
      const collapsed = localStorage.getItem('sb_collapsed') === '1';
      sidebar.classList.toggle('collapsed', collapsed);
      syncSidebarToggle();
    })();

    async function loadSection(section){
      if (section === "sottocategorie") section = "categorie";
      if (professionalSections.has(section) && licensePlan !== 'professional') {
        section = 'licenze';
      }
      if (shopRequiredSections.has(section) && !shopConfigured) {
        section = "attivita";
      }
      // UI
      pageTitle.textContent = titles[section] || "Dashboard";
      content.classList.add('loading');
      content.innerHTML = "Caricamento...";

      try{
        const res = await fetch(`/dashboard_user/section/${section}`, { headers: { "X-Requested-With": "fetch" }});
        if(!res.ok){
          if(res.status === 401) { window.location.href = "/login"; return; }
          throw new Error(`HTTP ${res.status}`);
        }
        const html = await res.text();
        content.innerHTML = html;

        // Le sezioni sono caricate come HTML parziale: esegui i loro script
        // in un proprio scope, così form e pulsanti restano operativi anche
        // quando l'utente cambia sezione più volte.
        for (const script of content.querySelectorAll('script')) {
          if (script.src) {
            const loadedScript = document.createElement('script');
            loadedScript.src = script.src;
            document.head.appendChild(loadedScript);
          } else if (script.textContent.trim()) {
            new Function(script.textContent)();
          }
          script.remove();
        }

        content.classList.remove('loading');

        // highlight menu
        for (const el of nav.querySelectorAll('.nav-item')) el.classList.remove('active');
        const activeBtn = nav.querySelector(`[data-section="${section}"]`);
        if(activeBtn) activeBtn.classList.add('active');

        // url state (bookmark)
        window.location.hash = section;
      } catch(e){
        content.classList.remove('loading');
        content.innerHTML = `<div class="error">Errore nel caricamento della sezione <b>${section}</b> (${e.message}).</div>`;
      }
    }

    // click handler
    nav.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-section]');
      if(!btn) return;
      setMobileMenuOpen(false);
      loadSection(btn.dataset.section);
    });

    window.alphaMenuInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      window.alphaMenuInstallPrompt = event;
      window.dispatchEvent(new Event('alphamenu-install-ready'));
    });
    window.installAlphaMenu = async () => {
      const prompt = window.alphaMenuInstallPrompt;
      if (!prompt) return false;
      prompt.prompt();
      await prompt.userChoice;
      window.alphaMenuInstallPrompt = null;
      return true;
    };
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');

    // boot: da hash o home
    const initial = (window.location.hash || "").replace("#","") || "home";
    syncShopLocks();
    window.loadShopBranding().then(() => loadSection(initial));
  </script>
</body>
</html>
