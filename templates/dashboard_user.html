<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#0f1a2e; --text:#e7ecff; --muted:#aab4d6;
      --border:rgba(255,255,255,.12); --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
      --sidebar-w:280px; --sidebar-collapsed:78px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    .app{display:flex;min-height:100vh}
    .sidebar{position:sticky;top:0;height:100vh;width:var(--sidebar-w);background:var(--panel);
      border-right:1px solid var(--border);box-shadow:var(--shadow);transition:width .2s ease;overflow-x:hidden;overflow-y:auto;scrollbar-color:rgba(255,255,255,.28) transparent;scrollbar-width:thin}
    .sidebar.collapsed{width:var(--sidebar-collapsed)}
    .sb-top{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--border)}
    .logo{width:38px;height:38px;border-radius:10px;background:#335;flex:0 0 auto}
    .titles{min-width:0}
    .titles strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .titles span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .toggle{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
      background:rgba(255,255,255,.05);color:var(--text);cursor:pointer}
    .sb-nav{padding:10px;display:flex;flex-direction:column;gap:6px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:var(--text);
      text-decoration:none;border:1px solid transparent;background:transparent;cursor:pointer}
    .nav-item:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.06)}
    .nav-item.active{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.12)}
    .icon{width:26px;height:26px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);flex:0 0 auto}
    .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
    .sidebar.collapsed .label, .sidebar.collapsed .titles{display:none}
    .main{flex:1;padding:16px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(255,255,255,.03);box-shadow:var(--shadow)}
    .topbar h1{margin:0;font-size:16px}
    .topbar-actions{display:flex;align-items:center;gap:10px}
    .pill{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04)}
    .logout-button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid rgba(255,110,110,.45);border-radius:10px;background:rgba(255,80,80,.12);color:#ffd2d2;text-decoration:none;font-size:14px;font-weight:600}
    .logout-button:hover{background:rgba(255,80,80,.22);border-color:rgba(255,150,150,.7)}
    .content{margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);
      background:rgba(255,255,255,.03);box-shadow:var(--shadow);padding:16px;min-height: 320px}
    .loading{opacity:.65}
    .error{padding:10px;border:1px solid rgba(255,80,80,.4);background:rgba(255,80,80,.12);border-radius:12px}
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sb-top">
        <div class="logo"></div>
        <div class="titles">
          <strong>Alpha Menu</strong>
          <span>{{ username }}</span>
        </div>
        <button class="toggle" onclick="toggleSidebar()" title="Comprimi/Espandi">☰</button>
      </div>

      <nav class="sb-nav" id="nav">
        <button class="nav-item active" data-section="home"><div class="icon">🏠</div><div class="label">Home</div></button>

        <button class="nav-item" data-section="prodotti"><div class="icon">🧾</div><div class="label">Prodotti</div></button>
        <button class="nav-item" data-section="categorie"><div class="icon">📁</div><div class="label">Categorie</div></button>
        <button class="nav-item" data-section="sottocategorie"><div class="icon">🗂️</div><div class="label">Sottocategorie</div></button>
        <button class="nav-item" data-section="allergeni"><div class="icon">⚠️</div><div class="label">Allergeni</div></button>

        <button class="nav-item" data-section="negozio"><div class="icon">🏪</div><div class="label">Negozio</div></button>
        <button class="nav-item" data-section="orari"><div class="icon">🕒</div><div class="label">Orari</div></button>

        <button class="nav-item" data-section="qrcode"><div class="icon">🔳</div><div class="label">QR Code</div></button>
        <button class="nav-item" data-section="anteprima"><div class="icon">👁️</div><div class="label">Anteprima menù</div></button>

        <button class="nav-item" data-section="licenze"><div class="icon">🔐</div><div class="label">Licenze</div></button>
        <button class="nav-item" data-section="account"><div class="icon">👤</div><div class="label">Account</div></button>
      </nav>

    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-actions">
          <div class="pill">Utente: {{ username }}</div>
          <a class="logout-button" href="/logout" aria-label="Esci dall'account">🚪 Esci</a>
        </div>
      </div>

      <div id="content" class="content"></div>
    </main>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    const pageTitle = document.getElementById('pageTitle');

    const titles = {
      home: "Home",
      prodotti: "Prodotti",
      categorie: "Categorie",
      sottocategorie: "Sottocategorie",
      allergeni: "Allergeni",
      negozio: "Negozio",
      orari: "Orari",
      qrcode: "QR Code",
      anteprima: "Anteprima menù",
      licenze: "Licenze",
      account: "Account"
    };

    function toggleSidebar(){
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('sb_collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
    }
    (function restore(){
      const collapsed = localStorage.getItem('sb_collapsed') === '1';
      sidebar.classList.toggle('collapsed', collapsed);
    })();

    async function loadSection(section){
      // UI
      pageTitle.textContent = titles[section] || "Dashboard";
      content.classList.add('loading');
      content.innerHTML = "Caricamento...";

      try{
        const res = await fetch(`/dashboard_user/section/${section}`, { headers: { "X-Requested-With": "fetch" }});
        if(!res.ok){
          if(res.status === 401) { window.location.href = "/login"; return; }
          throw new Error(`HTTP ${res.status}`);
        }
        const html = await res.text();
        content.innerHTML = html;
        content.classList.remove('loading');

        // highlight menu
        for (const el of nav.querySelectorAll('.nav-item')) el.classList.remove('active');
        const activeBtn = nav.querySelector(`[data-section="${section}"]`);
        if(activeBtn) activeBtn.classList.add('active');

        // url state (bookmark)
        window.location.hash = section;
      } catch(e){
        content.classList.remove('loading');
        content.innerHTML = `<div class="error">Errore nel caricamento della sezione <b>${section}</b> (${e.message}).</div>`;
      }
    }

    // click handler
    nav.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-section]');
      if(!btn) return;
      loadSection(btn.dataset.section);
    });

    // boot: da hash o home
    const initial = (window.location.hash || "").replace("#","") || "home";
    loadSection(initial);
  </script>
</body>
</html>
