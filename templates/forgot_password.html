<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="{{ url_for('static', filename='alpha-menu-logo.jpg') }}" type="image/jpeg"><title>Recupera password · Alpha Menu</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:url('/static/background.png') center/cover fixed;font-family:Inter,Arial,sans-serif;color:#16324f}body:before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:-1}.card{width:min(430px,100%);padding:30px;background:#fff;border-radius:18px;box-shadow:0 16px 45px rgba(0,0,0,.25)}img{display:block;width:210px;max-width:70%;margin:0 auto 14px}h1{text-align:center;color:#003366;font-size:24px;margin:0 0 8px}p{color:#586b7e;line-height:1.5}label{display:block;font-weight:700;margin-top:18px}input{width:100%;padding:12px;margin-top:6px;border:1px solid #c9d6e2;border-radius:9px;font:inherit}button{width:100%;padding:13px;margin-top:16px;border:0;border-radius:9px;background:#075ec9;color:#fff;font-weight:800;cursor:pointer}.message{padding:12px;border-radius:9px;background:#eaf8ef;color:#176b38}.back{display:block;text-align:center;margin-top:17px;color:#075ec9;font-weight:700;text-decoration:none}</style></head>
<body><main class="card"><img src="{{ url_for('static', filename='alpha-menu-logo.jpg') }}" alt="Alpha Menu"><h1>Recupera la password</h1><p>Inserisci l’email utilizzata per Alpha Menu. Se esiste un account, riceverai un collegamento valido per un’ora.</p>
{% if message %}<div class="message">{{ message }}</div>{% else %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><button type="submit">Invia le istruzioni</button></form>{% endif %}
<a class="back" href="{{ url_for('login') }}">Torna all’accesso</a></main></body></html>
