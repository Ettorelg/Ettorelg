<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordini da evadere · Alpha Menu</title>
<link rel="stylesheet" href="{{ url_for('static', filename='fulfillment-cards.css') }}?v=1">
<style>body{margin:0;background:#111b2b;color:#f4f7ff;font:16px system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;background:#192d48}a{color:#c9dcff}main{max-width:1200px;margin:auto;padding:22px}h1{font-size:1.7rem}p{color:#c3d1e5}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.tools input,.tools button,.order-modal button{padding:10px;border:1px solid #759ac3;border-radius:9px;background:#213e62;color:#fff;font:inherit}.tools button,.order-modal button{cursor:pointer}.group{margin:20px 0;border:1px solid #4a6d95;border-radius:14px;overflow:hidden}.group h2{margin:0;padding:13px 16px;background:#25466e;font-size:1.1rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;padding:15px}.card{padding:16px;background:#2a4e77;border-radius:11px}.quantity{display:block;font-size:2.5rem;font-weight:900}.name{font-weight:800}.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:.86rem}.done{color:#b9c3d0;text-decoration:line-through}#status{min-height:22px}.add-order{position:fixed;right:24px;bottom:24px;z-index:10;padding:15px 22px;border:1px solid #ffe09a;border-radius:13px;background:#eeb643;color:#152238;font:800 1rem system-ui;box-shadow:0 8px 25px #0008;cursor:pointer}.order-modal{width:min(820px,calc(100vw - 34px));max-height:calc(100dvh - 34px);overflow:auto;box-sizing:border-box;border:1px solid #759ac3;border-radius:16px;background:#1b304b;color:#fff;padding:20px}.order-modal::backdrop{background:#050b16c9}.order-modal form{display:grid;gap:12px}.order-modal label{display:grid;gap:5px}.order-modal input,.order-modal textarea,.order-modal select{box-sizing:border-box;width:100%;min-height:40px;padding:9px;border:1px solid #6b87a8;border-radius:8px;background:#101f34;color:#fff;font:inherit}.order-modal .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.order-modal .line{display:grid;grid-template-columns:minmax(0,1fr) 100px auto;gap:7px;align-items:end}.order-modal .results{display:grid;gap:5px;max-height:180px;overflow:auto}.order-modal .results button{text-align:left}.order-modal .foot{display:flex;gap:8px;flex-wrap:wrap}.order-modal .save{display:flex;align-items:center;gap:8px}.order-modal .save input{width:18px;min-height:18px}.order-modal .note{font-size:.8rem}@media(max-width:620px){.order-modal .form-grid{grid-template-columns:1fr}.order-modal .line{grid-template-columns:minmax(0,1fr) 80px auto}.add-order{right:12px;bottom:12px}}</style></head>
<body><style>.view-toggle,.quantity-switch{display:flex;gap:7px;flex-wrap:wrap}.view-toggle button,.quantity-switch button{padding:10px 14px;border:1px solid #6485a8;border-radius:9px;background:#203650;color:#fff;font:800 .9rem system-ui;cursor:pointer}.view-toggle button[aria-pressed=true],.quantity-switch button[aria-pressed=true]{background:#326a9f;border-color:#b8d9ff}.view-toggle{margin-top:18px}.tools{margin:12px 0 18px;padding:12px;border:1px solid #395779;border-radius:12px;background:#1b304b}.tools select{padding:10px;border:1px solid #759ac3;border-radius:9px;background:#213e62;color:#fff;font:inherit}.tools details{margin-left:auto}.tools summary{cursor:pointer}.tools .filter-content{display:flex;gap:9px;flex-wrap:wrap;padding:10px}.tools .filter-content label{display:grid;gap:4px}.quantity-switch{margin:15px 15px 0}.card .meta{display:grid;grid-template-columns:1fr auto;gap:4px}.card .meta span:nth-child(even),.card .meta b:nth-child(even){text-align:right}.card small{display:block;color:#bbd1ec;margin:5px 0 10px}.order-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:15px}.order-card{padding:14px;border:1px solid #56789b;border-left:5px solid #eeb643;border-radius:10px;background:#223c5c}.order-card.done{opacity:.7;border-left-color:#8c9aab}.order-card h3{margin:0 0 7px}.order-card p{margin:5px 0}.order-card ul{padding-left:21px}</style><header><strong>Alpha Menu · Banco evasione ordini</strong><a href="{{ url_for('logout') }}">Esci</a></header><main><h1>Banco evasione ordini</h1><p>{{ username }} · Gli ordini si aggiornano automaticamente. Puoi aggiungere ordini, ma non modificare le impostazioni del locale.</p><div class="view-toggle" role="group" aria-label="Vista evasione"><button id="summaryView" type="button" aria-pressed="true">Da preparare in totale</button><button id="ordersView" type="button" aria-pressed="false">Singoli ordini da evadere</button></div><div class="tools"><button id="previous" type="button" aria-label="Periodo precedente">←</button><input id="date" type="date" aria-label="Data degli ordini"><button id="next" type="button" aria-label="Periodo successivo">→</button><button id="today" type="button">Oggi</button><details><summary>Opzioni di vista ▾</summary><div class="filter-content"><label>Intervallo<select id="period"><option value="giorno">Un giorno</option><option value="settimana">Una settimana</option></select></label><label>Raggruppa<select id="grouping"><option value="giorno">Per giorno</option><option value="fascia">Per orario di ritiro</option></select></label><label>Categoria<select id="productCategory"><option value="">Tutte le categorie</option></select></label><label>Ordina prodotti<select id="productSort"><option value="menu">Ordine del menu</option><option value="nome">Nome A-Z</option><option value="quantita">Quantità decrescente</option></select></label></div></details><button id="refresh" type="button" aria-label="Aggiorna ordini">↻</button></div><p id="status" role="status"></p><div id="groups"></div></main>
<button id="addOrder" class="add-order" type="button">+ Aggiungi ordine</button>
<dialog id="orderDialog" class="order-modal" aria-labelledby="orderTitle"><h2 id="orderTitle">Aggiungi ordine</h2><form id="orderForm"><label>Cerca cliente salvato (facoltativo)<input id="customerSearch" type="search" placeholder="Nome, telefono o email" autocomplete="off"></label><div id="customerResults" class="results"></div><div class="form-grid"><label>Nome cliente<input name="nome" minlength="2" maxlength="120" required></label><label>Telefono<input name="telefono" type="tel" minlength="6" maxlength="40" required></label><label>Email facoltativa<input name="email" type="email" maxlength="254"></label><label>Data richiesta<input id="orderDate" name="data_richiesta" type="date" required></label><label id="slotField" hidden>Fascia di ritiro<select name="ora_richiesta" id="orderSlot"><option value="">Scegli fascia</option></select></label><label>Riferimento<input name="riferimento" maxlength="80"></label></div><label>Note<textarea name="note" maxlength="500" rows="2"></textarea></label><label class="save"><input name="salva_cliente" type="checkbox">Salva il cliente in rubrica</label><strong>Articoli</strong><div id="orderLines"></div><div class="foot"><button id="addLine" type="button">+ Aggiungi articolo</button><button type="submit">Registra ordine</button><button id="closeOrder" type="button">Chiudi</button></div><p id="orderMessage" role="status"></p></form></dialog>
<script>
const dateField=document.getElementById('date'),groups=document.getElementById('groups'),status=document.getElementById('status');
const period=document.getElementById('period'),grouping=document.getElementById('grouping');
const productCategory=document.getElementById('productCategory'),productSort=document.getElementById('productSort');
productSort.add(new Option('Categoria A-Z','categoria'),1);
dateField.value=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'});
const fmt=n=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:3}).format(n);
let currentOrders=[],displayMode='totali',quantityMode='total';
function element(parent,tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;parent.append(node);return node}
function displayDate(value){return new Date(value+'T12:00:00').toLocaleDateString('it-IT')}
function visibleProducts(order){return order.prodotti.filter(item=>!productCategory.value||String(item.id_categoria??'none')===productCategory.value)}
function updateCategories(){const selected=productCategory.value;const categories=new Map();for(const order of currentOrders)for(const item of order.prodotti)categories.set(String(item.id_categoria??'none'),item.categoria||'Senza categoria');productCategory.replaceChildren(new Option('Tutte le categorie',''));for(const [id,name] of [...categories].sort((a,b)=>a[1].localeCompare(b[1],'it')))productCategory.add(new Option(name,id));productCategory.value=categories.has(selected)?selected:''}
function render(){
  groups.replaceChildren();const buckets=new Map();
  for(const order of currentOrders){if(productCategory.value&&!visibleProducts(order).length)continue;const key=grouping.value==='fascia'?order.data_richiesta+'|'+(order.ora_richiesta||'Senza fascia'):order.data_richiesta;if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(order)}
  if(!buckets.size){element(groups,'p',productCategory.value?'Nessun articolo nella categoria selezionata.':'Nessun ordine nel periodo.');return}
  for(const [key,orders] of [...buckets].sort((a,b)=>a[0].localeCompare(b[0]))){
    const section=element(groups,'section',undefined,'group');const heading=element(section,'h2',undefined);const parts=key.split('|');heading.textContent=displayDate(parts[0])+(parts[1]?' · '+parts[1]:'')+' · '+orders.length+' ordini';
    if(displayMode==='ordini'){
      const grid=element(section,'div',undefined,'order-grid');
      for(const order of orders){const card=element(grid,'article',undefined,'order-card'+(order.stato==='evaso'?' done':''));element(card,'h3','#'+order.id+' · '+order.nome+' · '+order.stato.replaceAll('_',' '));element(card,'p',(order.ora_richiesta||'Solo giorno')+' · '+(order.origine==='tavolo'?'Al tavolo':'Da asporto'));const list=element(card,'ul');for(const item of visibleProducts(order))element(list,'li',fmt(Number(item.quantita))+' × '+item.nome);if(order.note)element(card,'p','Note: '+order.note);if(order.stato!=='evaso'){const actions=element(card,'div',undefined,'actions');const finish=element(actions,'button','Segna evaso','finish');finish.type='button';finish.onclick=async()=>{finish.disabled=true;try{const response=await fetch('/api/ordini/'+order.id,{method:'PATCH',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({stato:'evaso'})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Aggiornamento non riuscito.');await load()}catch(error){status.textContent=error.message;finish.disabled=false}}}}
    }else{
      const switcher=element(section,'div',undefined,'quantity-switch');for(const [mode,label] of [['total','Totale'],['pending','Da preparare'],['done','Evasi']]){const button=element(switcher,'button',label);button.type='button';button.setAttribute('aria-pressed',String(quantityMode===mode));button.onclick=()=>{quantityMode=mode;render()}}
      const sums=new Map();for(const order of orders)for(const item of visibleProducts(order)){const identity=String(item.id_prodotto??(item.categoria+'|'+item.nome));const row=sums.get(identity)||{name:item.nome,category:item.categoria||'Senza categoria',categoryOrder:item.ordine_categoria??999999,productOrder:item.ordine_prodotto??999999,total:0,pending:0,done:0};const quantity=Number(item.quantita);row.total+=quantity;row[order.stato==='evaso'?'done':'pending']+=quantity;sums.set(identity,row)}
      const sorted=[...sums.values()].sort((a,b)=>productSort.value==='categoria'?a.category.localeCompare(b.category,'it')||a.name.localeCompare(b.name,'it'):productSort.value==='nome'?a.name.localeCompare(b.name,'it'):productSort.value==='quantita'?b[quantityMode]-a[quantityMode]||a.name.localeCompare(b.name,'it'):a.categoryOrder-b.categoryOrder||a.productOrder-b.productOrder||a.name.localeCompare(b.name,'it'));
      const cards=element(section,'div',undefined,'cards');for(const row of sorted){const card=element(cards,'div',undefined,'card');element(card,'strong',fmt(row[quantityMode]),'quantity');element(card,'div',row.name,'name');element(card,'small',row.category);const meta=element(card,'div',undefined,'meta');for(const [label,value,style] of [['Evasi',row.done,'done'],['',row.done,'done'],['Da preparare',row.pending,''],['',row.pending,''],['Totale',row.total,''],['',row.total,'']])element(meta,label?'span':'b',label||fmt(value),style)}
    }
  }
}
async function load(){try{const query=new URLSearchParams({periodo:period.value,data:dateField.value});const response=await fetch('/api/ordini/evasione?'+query,{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Caricamento non riuscito.');currentOrders=data.ordini;updateCategories();render();status.textContent=currentOrders.length?'Ultimo aggiornamento: '+new Date().toLocaleTimeString('it-IT'):'Nessun ordine per questo periodo.'}catch(e){status.textContent=e.message}}
function shift(days){const d=new Date(dateField.value+'T12:00:00');d.setDate(d.getDate()+days*(period.value==='settimana'?7:1));dateField.value=d.toLocaleDateString('sv-SE');load()}
document.getElementById('previous').onclick=()=>shift(-1);document.getElementById('next').onclick=()=>shift(1);document.getElementById('today').onclick=()=>{dateField.value=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'});load()};document.getElementById('refresh').onclick=load;dateField.onchange=load;period.onchange=load;grouping.onchange=render;productCategory.onchange=render;productSort.onchange=render;
document.getElementById('summaryView').onclick=()=>{displayMode='totali';document.getElementById('summaryView').setAttribute('aria-pressed','true');document.getElementById('ordersView').setAttribute('aria-pressed','false');render()};document.getElementById('ordersView').onclick=()=>{displayMode='ordini';document.getElementById('summaryView').setAttribute('aria-pressed','false');document.getElementById('ordersView').setAttribute('aria-pressed','true');render()};load();setInterval(load,15000);
</script>
<script>
const orderDialog=document.getElementById('orderDialog'),orderForm=document.getElementById('orderForm'),orderLines=document.getElementById('orderLines'),orderMessage=document.getElementById('orderMessage');
const orderDate=document.getElementById('orderDate'),orderSlot=document.getElementById('orderSlot'),slotField=document.getElementById('slotField');
const csrf={{ csrf_token()|tojson }};
let products=[],pickupConfig={};
const customerSearch=document.getElementById('customerSearch'),customerResults=document.getElementById('customerResults');let customerTimer=0,customerRequest=0;
customerSearch.oninput=()=>{clearTimeout(customerTimer);const query=customerSearch.value.trim();const current=++customerRequest;customerResults.replaceChildren();if(!query)return;customerTimer=setTimeout(async()=>{try{const response=await fetch('/api/ordini/clienti?q='+encodeURIComponent(query)),data=await response.json();if(current!==customerRequest)return;if(!response.ok)throw new Error(data.error);for(const customer of data.clienti){const button=document.createElement('button');button.type='button';button.textContent=customer.nome+' · '+customer.telefono+(customer.email?' · '+customer.email:'');button.onclick=()=>{orderForm.elements.nome.value=customer.nome;orderForm.elements.telefono.value=customer.telefono;orderForm.elements.email.value=customer.email||'';customerSearch.value=customer.nome;customerResults.replaceChildren()};customerResults.append(button)}}catch(e){orderMessage.textContent=e.message||'Ricerca cliente non disponibile.'}},220)};
function addOrderLine(){const line=document.createElement('div');line.className='line';const picker=document.createElement('label');picker.textContent='Cerca articolo';const search=document.createElement('input');search.type='search';search.placeholder='Nome del prodotto';search.required=true;const results=document.createElement('div');results.className='results';picker.append(search,results);const quantityLabel=document.createElement('label');quantityLabel.textContent='Quantità';const quantity=document.createElement('input');quantity.type='number';quantity.min='0.001';quantity.max='999';quantity.step='0.001';quantity.value='1';quantity.required=true;quantityLabel.append(quantity);const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Rimuovi articolo');remove.onclick=()=>line.remove();function showResults(){results.replaceChildren();const q=search.value.trim().toLocaleLowerCase('it-IT');if(!q)return;for(const product of products.filter(x=>x.nome.toLocaleLowerCase('it-IT').includes(q)).slice(0,8)){const button=document.createElement('button');button.type='button';button.textContent=product.nome+' · € '+product.prezzo_euro+(product.unita_prezzo==='kg'?' / kg':'');button.onclick=()=>{line.dataset.productId=product.id;search.value=product.nome;quantityLabel.firstChild.textContent=product.unita_prezzo==='kg'?'Peso (kg)':'Quantità';results.replaceChildren();quantity.focus()};results.append(button)}if(!results.childElementCount){const hint=document.createElement('small');hint.textContent='Nessun articolo trovato.';results.append(hint)}}search.oninput=()=>{delete line.dataset.productId;showResults()};line.append(picker,quantityLabel,remove);orderLines.append(line);search.focus()}
function renderSlots(){const cfg=pickupConfig;slotField.hidden=!cfg.fasce_ritiro_attive;orderSlot.required=!!cfg.fasce_ritiro_attive;orderSlot.replaceChildren(new Option('Scegli fascia',''));if(!cfg.fasce_ritiro_attive||!orderDate.value)return;const weekday=(new Date(orderDate.value+'T12:00:00Z').getUTCDay()+6)%7,duration=Number(cfg.minuti_fascia_ritiro)||15;for(const window of cfg.fasce_settimanali?.[weekday]||[]){const start=Number(window.dalle.slice(0,2))*60+Number(window.dalle.slice(3,5)),end=Number(window.alle.slice(0,2))*60+Number(window.alle.slice(3,5));for(let minute=start;minute+duration<=end;minute+=duration){const label=String(Math.floor(minute/60)).padStart(2,'0')+':'+String(minute%60).padStart(2,'0');orderSlot.add(new Option(label,label))}}}
orderDate.addEventListener('change',renderSlots);
document.getElementById('addOrder').onclick=async()=>{orderMessage.textContent='Caricamento articoli…';orderDialog.showModal();orderDate.value=dateField.value;orderDate.min=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'});try{const [p,c]=await Promise.all([fetch('/api/prodotti'),fetch('/api/ordini/configurazione')]);if(!p.ok||!c.ok)throw new Error('Impossibile caricare gli articoli o le fasce.');products=(await p.json()).items.filter(item=>item.disponibile);pickupConfig=await c.json();renderSlots();orderLines.replaceChildren();addOrderLine();orderMessage.textContent=''}catch(e){orderMessage.textContent=e.message}};
document.getElementById('closeOrder').onclick=()=>orderDialog.close();document.getElementById('addLine').onclick=addOrderLine;
orderForm.onsubmit=async event=>{event.preventDefault();const rows=[...orderLines.querySelectorAll('.line')];const items=rows.map(row=>({id:Number(row.dataset.productId),quantita:row.querySelector('input[type=number]').value}));if(!items.length||items.some(x=>!x.id)||new Set(items.map(x=>x.id)).size!==items.length){orderMessage.textContent='Scegli almeno un articolo dai risultati, senza duplicati.';return}const form=new FormData(orderForm);const payload={nome:form.get('nome'),telefono:form.get('telefono'),email:form.get('email'),data_richiesta:form.get('data_richiesta'),ora_richiesta:form.get('ora_richiesta'),riferimento:form.get('riferimento'),note:form.get('note'),salva_cliente:form.has('salva_cliente'),prodotti:items};const submit=orderForm.querySelector('[type=submit]');submit.disabled=true;orderMessage.textContent='Registrazione in corso…';try{const response=await fetch('/api/ordini/manuale',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(payload)}),result=await response.json();if(!response.ok)throw new Error(result.error||'Ordine non registrato.');orderForm.reset();orderLines.replaceChildren();dateField.value=payload.data_richiesta;orderDialog.close();await load();status.textContent='Ordine #'+result.ordine_id+' registrato.'}catch(e){orderMessage.textContent=e.message}finally{submit.disabled=false}};
</script></body></html>
