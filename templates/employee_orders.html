<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordini da evadere · Alpha Menu</title>
<style>body{margin:0;background:#111b2b;color:#f4f7ff;font:16px system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;background:#192d48}a{color:#c9dcff}main{max-width:1200px;margin:auto;padding:22px}h1{font-size:1.7rem}p{color:#c3d1e5}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.tools input,.tools button{padding:10px;border:1px solid #759ac3;border-radius:9px;background:#213e62;color:#fff;font:inherit}.tools button{cursor:pointer}.group{margin:20px 0;border:1px solid #4a6d95;border-radius:14px;overflow:hidden}.group h2{margin:0;padding:13px 16px;background:#25466e;font-size:1.1rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;padding:15px}.card{padding:16px;background:#2a4e77;border-radius:11px}.quantity{display:block;font-size:2.5rem;font-weight:900}.name{font-weight:800}.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:.86rem}.done{color:#b9c3d0;text-decoration:line-through}#status{min-height:22px}</style></head>
<body><header><strong>Alpha Menu · Ordini da evadere</strong><a href="{{ url_for('logout') }}">Esci</a></header><main><h1>Banco ordini</h1><p>Vista di sola lettura per {{ username }}. Si aggiorna automaticamente.</p><div class="tools"><button id="previous" type="button">← Giorno prima</button><input id="date" type="date" aria-label="Data degli ordini"><button id="next" type="button">Giorno dopo →</button><button id="refresh" type="button">Aggiorna</button></div><p id="status" role="status"></p><div id="groups"></div></main>
<script>
const dateField=document.getElementById('date'),groups=document.getElementById('groups'),status=document.getElementById('status');
dateField.value=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'});
const fmt=n=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:3}).format(n);
async function load(){try{const response=await fetch('/api/ordini/evasione?periodo=giorno&data='+encodeURIComponent(dateField.value),{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Caricamento non riuscito.');const sums=new Map();for(const order of data.ordini){if(order.stato==='annullato')continue;for(const item of order.prodotti){const key=item.nome;const row=sums.get(key)||{total:0,done:0,pending:0};const q=Number(item.quantita);row.total+=q;if(order.stato==='evaso')row.done+=q;else row.pending+=q;sums.set(key,row)}}groups.replaceChildren();const section=document.createElement('section');section.className='group';const title=document.createElement('h2');title.textContent=dateField.value+' · '+data.ordini.length+' ordini';section.append(title);const cards=document.createElement('div');cards.className='cards';for(const [name,row] of sums){const card=document.createElement('div');card.className='card';const quantity=document.createElement('strong');quantity.className='quantity';quantity.textContent=fmt(row.pending);const label=document.createElement('div');label.className='name';label.textContent=name;const meta=document.createElement('div');meta.className='meta';meta.innerHTML='<span>Da preparare</span><span class="done">Evasi</span><span>Totale</span>';const values=document.createElement('div');values.className='meta';for(const [n,cls] of [[row.pending,''],[row.done,'done'],[row.total,'']]){const x=document.createElement('b');x.className=cls;x.textContent=fmt(n);values.append(x)}card.append(quantity,label,meta,values);cards.append(card)}section.append(cards);groups.append(section);status.textContent=sums.size?'Ultimo aggiornamento: '+new Date().toLocaleTimeString('it-IT'):'Nessun articolo per questa data.'}catch(e){status.textContent=e.message}}
function shift(days){const d=new Date(dateField.value+'T12:00:00');d.setDate(d.getDate()+days);dateField.value=d.toLocaleDateString('sv-SE');load()}
document.getElementById('previous').onclick=()=>shift(-1);document.getElementById('next').onclick=()=>shift(1);document.getElementById('refresh').onclick=load;dateField.onchange=load;load();setInterval(load,15000);
</script></body></html>
