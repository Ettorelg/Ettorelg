<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Menu Online</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: url("/static/background.png") no-repeat center center fixed;
            background-size: cover;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.35);
            backdrop-filter: blur(1px);
            z-index: -1;
        }
        .register-card {
            background: white;
            padding: 34px 35px;
            border-radius: 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
            text-align: center;
        }
        .logo { width: 220px; max-width: 78%; margin-bottom: 13px; }
        .subtitle { margin: 0 0 22px; color: #52657a; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        label { display: block; font-weight: 600; font-size: 14px; color: #003366; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 5px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #c9d6e2;
            outline: none;
            transition: border .2s, box-shadow .2s;
        }
        input:focus { border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,.2); }
        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: linear-gradient(to right, #004aad, #007bff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: .25s;
        }
        .btn:hover { transform: scale(1.03); }
        .google-btn { background: white; color: #004aad; border: 2px solid #004aad; }
        .google-btn.disabled { opacity: .55; pointer-events: none; }
        .account-links { margin: 17px 0 0; font-size: 14px; color: #52657a; }
        .account-links a { color: #007bff; font-weight: 600; text-decoration: none; }
        .account-links a:hover { text-decoration: underline; }
        .google-note { margin: 8px 0 0; color: #6b7785; font-size: 12px; }
        .error-box {
            background: rgba(220,53,69,.12);
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        @media (max-width:480px) {
            body { align-items: flex-start; padding: 14px; }
            .register-card { padding: 26px 21px; }
            .logo { width: 190px; }
        }
    </style>
</head>
<body>
    <div class="register-card">
        <img src="/static/logo1.png" alt="AlphaSystem Logo" class="logo">
        <p class="subtitle">Crea il tuo account: 14 giorni gratis, poi 99 € IVA inclusa all'anno.</p>
        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" value="{{ request.form.get('username','') }}" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" value="{{ request.form.get('email','') }}" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="password_confirm">Conferma password</label>
                <input id="password_confirm" name="password_confirm" type="password" minlength="8" autocomplete="new-password" required>
            </div>
            <button class="btn" type="submit">Registrati e continua con PayPal</button>
        </form>
        <a class="btn google-btn{% if not google_enabled %} disabled{% endif %}" href="{{ url_for('auth_google') }}">Registrati con Google</a>
        {% if not google_enabled %}<p class="google-note">Accesso Google in configurazione.</p>{% endif %}
        <p class="account-links">Hai già un account? <a href="{{ url_for('login') }}">Accedi</a></p>
    </div>
    {% include '_legal_footer.html' %}
</body>
</html>
