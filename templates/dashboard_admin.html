<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amministrazione · Alpha Menu</title>
<style>
:root{--bg:#0b1220;--panel:#111d32;--panel2:#172641;--text:#edf1ff;--muted:#aab4d0;--brand:#6d78ff;--green:#43d17c;--red:#ff7180;--amber:#ffc857;--line:#2a3853}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}header{padding:22px max(18px,4vw);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}a{color:inherit}.wrap{padding:24px max(18px,4vw);max-width:1500px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:18px}.top{display:flex;gap:12px;justify-content:space-between;align-items:end;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px;background:var(--panel2);color:var(--text)}button{cursor:pointer;font-weight:800}.primary{background:var(--brand);border-color:var(--brand)}.renew{background:#17663a;border-color:#238750}.danger{background:#48202a;border-color:#7d3444;color:#ffbdc4}.danger:hover{background:#662936}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1220px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:.78rem;text-transform:uppercase}.cell-input{width:150px}.email{width:210px}.date{width:145px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:.76rem;font-weight:900}.ok{background:#163e2a;color:#74e9a3}.warn{background:#493b16;color:#ffd97a}.bad{background:#4a1e29;color:#ff9baa}.stats{display:flex;gap:14px;color:var(--muted)}.stats strong{color:var(--text)}.msg{min-height:24px;color:var(--green)}.msg.error{color:var(--red)}.row-actions{display:flex;gap:7px;flex-wrap:wrap;min-width:280px}.row-actions button{padding:8px 10px;font-size:.8rem}@media(max-width:600px){header{align-items:flex-start;gap:12px}.wrap{padding:14px}.panel{padding:13px}.filters>*{width:100%}}
</style></head><body><header><div><strong>ALPHA MENU · ADMIN</strong><div style="color:var(--muted)">Ciao, {{ username }}</div></div><a href="/logout">Esci</a></header>
<main class="wrap"><section class="panel"><h2 style="margin-top:0">Crea utente</h2><div class="filters"><input id="newUsername" placeholder="Username"><input id="newEmail" type="email" placeholder="Email"><input id="newPassword" type="password" placeholder="Password (min. 8)"><label><input id="newAdmin" type="checkbox"> Admin</label><button class="primary" onclick="createUser()">Crea con licenza annuale</button></div></section>
<section class="panel"><div class="top"><div><h2 style="margin:0 0 6px">Utenti e licenze</h2><div class="stats"><span>Totali: <strong id="total">0</strong></span><span>In scadenza: <strong id="expiring">0</strong></span></div></div><div class="filters"><input id="search" placeholder="Cerca utente, email o negozio" oninput="render()"><select id="filter" onchange="render()"><option value="all">Tutte le licenze</option><option value="expiring">In scadenza (30 giorni)</option><option value="expired">Scadute</option><option value="suspended">Sospese</option></select></div></div><p id="message" class="msg"></p><div class="table-wrap"><table><thead><tr><th>Utente</th><th>Email</th><th>Negozio</th><th>Admin</th><th>Stato licenza</th><th>Scadenza</th><th>Giorni</th><th>Nuova password</th><th>Azioni</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
{% include '_legal_footer.html' %}
<script>
let users=[];let currentUserId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t,error=false){const el=document.getElementById('message');el.textContent=t;el.className='msg'+(error?' error':'')}
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw new Error(d.error||'Operazione non riuscita');return d}
async function load(){try{const d=await api('/api/admin/utenti');users=d.items;currentUserId=d.current_user_id;document.getElementById('total').textContent=users.length;document.getElementById('expiring').textContent=users.filter(x=>x.in_scadenza).length;render()}catch(e){notify(e.message,true)}}
function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const list=users.filter(x=>{const hit=[x.username,x.email,x.negozio].join(' ').toLowerCase().includes(q);const status=f==='all'||(f==='expiring'&&x.in_scadenza)||(f==='expired'&&x.giorni_rimanenti<0)||(f==='suspended'&&x.stato_licenza==='sospesa');return hit&&status});document.getElementById('rows').innerHTML=list.map(rowHtml).join('')||'<tr><td colspan="9">Nessun utente trovato.</td></tr>'}
function rowHtml(x){const expired=x.giorni_rimanenti<0,cls=x.stato_licenza==='sospesa'||expired?'bad':x.in_scadenza?'warn':'ok';const label=x.stato_licenza==='sospesa'?'SOSPESA':expired?'SCADUTA':x.in_scadenza?'IN SCADENZA':'ATTIVA';return `<tr data-id="${x.id}"><td><input class="cell-input username" value="${esc(x.username)}"></td><td><input class="email" type="email" value="${esc(x.email)}"></td><td>${esc(x.negozio)||'—'}</td><td><input class="admin" type="checkbox" ${x.admin?'checked':''} ${x.id===currentUserId?'title="Account corrente"':''}></td><td><span class="badge ${cls}">${label}</span><select class="status"><option value="attiva" ${x.stato_licenza==='attiva'?'selected':''}>Attiva</option><option value="sospesa" ${x.stato_licenza==='sospesa'?'selected':''}>Sospesa</option></select></td><td><input class="date" type="date" value="${x.data_scadenza||''}"></td><td>${x.giorni_rimanenti??'—'}</td><td><input class="password" type="password" placeholder="Lascia vuoto"></td><td><div class="row-actions"><button onclick="saveUser(${x.id})">Salva account</button><button onclick="saveLicense(${x.id})">Salva licenza</button><button class="renew" onclick="renew(${x.id})">+ 1 anno</button><button class="danger" onclick="deleteLicense(${x.id})">Elimina licenza</button><button class="danger" onclick="deleteUser(${x.id})" ${x.id===currentUserId?'disabled title="Non puoi eliminare il tuo account"':''}>Elimina utente</button></div></td></tr>`}
function tr(id){return document.querySelector('tr[data-id="'+id+'"]')}
async function createUser(){try{await api('/api/admin/utenti',{method:'POST',body:JSON.stringify({username:newUsername.value.trim(),email:newEmail.value.trim(),password:newPassword.value,admin:newAdmin.checked})});newUsername.value=newEmail.value=newPassword.value='';newAdmin.checked=false;notify('Utente creato con licenza annuale.');await load()}catch(e){notify(e.message,true)}}
async function saveUser(id){const r=tr(id);try{await api('/api/admin/utenti/'+id,{method:'PUT',body:JSON.stringify({username:r.querySelector('.username').value,email:r.querySelector('.email').value,password:r.querySelector('.password').value,admin:r.querySelector('.admin').checked})});notify('Account aggiornato.');await load()}catch(e){notify(e.message,true)}}
async function saveLicense(id){const r=tr(id);try{await api('/api/admin/licenze/'+id,{method:'PUT',body:JSON.stringify({stato:r.querySelector('.status').value,data_scadenza:r.querySelector('.date').value})});notify('Licenza aggiornata.');await load()}catch(e){notify(e.message,true)}}
async function renew(id){try{await api('/api/admin/licenze/'+id+'/rinnova',{method:'POST'});notify('Licenza rinnovata per un anno.');await load()}catch(e){notify(e.message,true)}}
async function deleteLicense(id){const x=users.find(u=>u.id===id);if(!x||!confirm(`Eliminare la licenza di ${x.username}?\n\nL'accesso verrà bloccato e l'eventuale rinnovo PayPal sarà disattivato.`))return;try{const d=await api('/api/admin/licenze/'+id,{method:'DELETE'});notify(d.message||'Licenza eliminata.');await load()}catch(e){notify(e.message,true)}}
async function deleteUser(id){const x=users.find(u=>u.id===id);if(!x||!confirm(`ELIMINARE DEFINITIVAMENTE L'UTENTE ${x.username}?\n\nVerranno rimossi anche negozio, prodotti, categorie e abbonamento PayPal. Questa operazione non può essere annullata.`))return;const typed=prompt(`Per confermare scrivi ELIMINA`);if(typed!=='ELIMINA')return;try{const d=await api('/api/admin/utenti/'+id,{method:'DELETE'});notify(d.message||'Utente eliminato.');await load()}catch(e){notify(e.message,true)}}
load();
</script></body></html>
