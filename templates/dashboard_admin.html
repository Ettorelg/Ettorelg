<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="{{ url_for('static', filename='alpha-menu-icon-am.svg') }}" type="image/svg+xml"><title>Amministrazione · Alpha Menu</title>
<style>
:root{--bg:#0b1220;--panel:#111d32;--panel2:#172641;--text:#edf1ff;--muted:#aab4d0;--brand:#6d78ff;--green:#43d17c;--red:#ff7180;--amber:#ffc857;--line:#2a3853}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}header{padding:22px max(18px,4vw);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}a{color:inherit}.wrap{padding:24px max(18px,4vw);max-width:1500px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:18px}.top{display:flex;gap:12px;justify-content:space-between;align-items:end;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px;background:var(--panel2);color:var(--text)}button{cursor:pointer;font-weight:800;min-height:42px}.primary{background:var(--brand);border-color:var(--brand)}.renew{background:#17663a;border-color:#238750}.danger{background:#48202a;border-color:#7d3444;color:#ffbdc4}.danger:hover{background:#662936}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1220px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:.78rem;text-transform:uppercase}.cell-input{width:150px}.email{width:210px}.date{width:145px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:.76rem;font-weight:900}.ok{background:#163e2a;color:#74e9a3}.warn{background:#493b16;color:#ffd97a}.bad{background:#4a1e29;color:#ff9baa}.stats{display:flex;gap:14px;color:var(--muted)}.stats strong{color:var(--text)}.msg{min-height:24px;color:var(--green)}.msg.error{color:var(--red)}.row-actions{display:flex;gap:7px;flex-wrap:wrap;min-width:280px}.row-actions button{padding:8px 10px;font-size:.8rem}@media(max-width:700px){header{align-items:flex-start;gap:12px;padding:15px}.wrap{padding:10px}.panel{padding:13px;border-radius:14px}.filters{display:grid;grid-template-columns:1fr;width:100%}.filters>*{width:100%;min-width:0}.stats{flex-wrap:wrap}.table-wrap{overflow:visible}table{min-width:0;display:block}thead{display:none}tbody{display:grid;gap:12px}tr{display:block;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}td{display:block;padding:6px 0;border:0}td input,td select,.cell-input,.email,.date{width:100%}.row-actions{display:grid;grid-template-columns:1fr 1fr;min-width:0;margin-top:8px}.row-actions button{width:100%}.legal-footer{margin-top:10px}}
</style></head><body><header><div style="display:flex;align-items:center;gap:12px"><img src="{{ url_for('static', filename='alpha-menu-icon-am.svg') }}" alt="Alpha Menu" width="52" height="52"><div><strong>ALPHA MENU · ADMIN</strong><div style="color:var(--muted)">Ciao, {{ username }}</div></div></div><a href="/logout">Esci</a></header>
<main class="wrap"><section class="panel"><h2 style="margin-top:0">Crea utente</h2><div class="filters"><input id="newUsername" placeholder="Username"><input id="newEmail" type="email" placeholder="Email"><input id="newPassword" type="password" placeholder="Password (min. 8)"><label><input id="newAdmin" type="checkbox"> Admin</label><button class="primary" onclick="createUser()">Crea con licenza annuale</button></div></section>
<section class="panel"><div class="top"><div><h2 style="margin:0 0 6px">Utenti e licenze</h2><div class="stats"><span>Totali: <strong id="total">0</strong></span><span>In scadenza: <strong id="expiring">0</strong></span></div></div><div class="filters"><input id="search" placeholder="Cerca utente, email o negozio" oninput="render()"><select id="filter" onchange="render()"><option value="all">Tutte le licenze</option><option value="expiring">In scadenza (30 giorni)</option><option value="expired">Scadute</option><option value="suspended">Sospese</option></select></div></div><p id="message" class="msg"></p><div class="table-wrap"><table><thead><tr><th>Account cliente</th><th>Email</th><th>Cliente / negozio</th><th>Admin</th><th>Piano e stato licenza</th><th>Scadenza</th><th>Giorni</th><th>Nuova password</th><th>Azioni</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<style>@media(max-width:700px){td::before{display:block;margin-bottom:4px;color:var(--muted);font-size:.7rem;font-weight:800;text-transform:uppercase}td:nth-child(1)::before{content:"Utente"}td:nth-child(2)::before{content:"Email"}td:nth-child(3)::before{content:"Negozio"}td:nth-child(4)::before{content:"Admin"}td:nth-child(5)::before{content:"Licenza"}td:nth-child(6)::before{content:"Scadenza"}td:nth-child(7)::before{content:"Giorni"}td:nth-child(8)::before{content:"Nuova password"}td:nth-child(9)::before{content:"Azioni"}}</style>
{% include '_legal_footer.html' %}
<script>
let users=[];let currentUserId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t,error=false){const el=document.getElementById('message');el.textContent=t;el.className='msg'+(error?' error':'')}
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw new Error(d.error||'Operazione non riuscita');return d}
async function load(){try{const d=await api('/api/admin/utenti');users=d.items;currentUserId=d.current_user_id;document.getElementById('total').textContent=users.length;document.getElementById('expiring').textContent=users.filter(x=>x.in_scadenza).length;render()}catch(e){notify(e.message,true)}}
function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const list=users.filter(x=>{const hit=[x.username,x.email,x.negozio].join(' ').toLowerCase().includes(q);const status=f==='all'||(f==='expiring'&&x.in_scadenza)||(f==='expired'&&x.giorni_rimanenti<0)||(f==='suspended'&&x.stato_licenza==='sospesa');return hit&&status});document.getElementById('rows').innerHTML=list.map(rowHtml).join('')||'<tr><td colspan="9">Nessun utente trovato.</td></tr>'}
function rowHtml(x){const expired=x.giorni_rimanenti<0,cls=x.stato_licenza==='sospesa'||expired?'bad':x.in_scadenza?'warn':'ok';const label=x.stato_licenza==='sospesa'?'SOSPESA':expired?'SCADUTA':x.in_scadenza?'IN SCADENZA':'ATTIVA';return `<tr data-id="${x.id}"><td><input class="cell-input username" value="${esc(x.username)}"></td><td><input class="email" type="email" value="${esc(x.email)}"></td><td>${esc(x.negozio)||'—'}</td><td><input class="admin" type="checkbox" ${x.admin?'checked':''} ${x.id===currentUserId?'title="Account corrente"':''}></td><td><select class="plan"><option value="professional" ${x.piano==='professional'?'selected':''}>Professional</option><option value="base" ${x.piano==='base'?'selected':''}>Base</option></select><span class="badge ${cls}">${label}</span><select class="status"><option value="attiva" ${x.stato_licenza==='attiva'?'selected':''}>Attiva</option><option value="sospesa" ${x.stato_licenza==='sospesa'?'selected':''}>Sospesa</option></select></td><td><input class="date" type="date" value="${x.data_scadenza||''}"></td><td>${x.giorni_rimanenti??'—'}</td><td><input class="password" type="password" placeholder="Lascia vuoto"></td><td><div class="row-actions"><button onclick="saveUser(${x.id})">Salva account</button><button onclick="saveLicense(${x.id})">Salva licenza</button><button class="renew" onclick="renew(${x.id})">+ 1 anno</button><button class="danger" onclick="deleteLicense(${x.id})">Elimina licenza</button><button class="danger" onclick="deleteUser(${x.id})" ${x.id===currentUserId?'disabled title="Non puoi eliminare il tuo account"':''}>Elimina utente</button></div></td></tr>`}
function tr(id){return document.querySelector('tr[data-id="'+id+'"]')}
async function createUser(){try{await api('/api/admin/utenti',{method:'POST',body:JSON.stringify({username:newUsername.value.trim(),email:newEmail.value.trim(),password:newPassword.value,admin:newAdmin.checked})});newUsername.value=newEmail.value=newPassword.value='';newAdmin.checked=false;notify('Utente creato con licenza annuale.');await load()}catch(e){notify(e.message,true)}}
async function saveUser(id){const r=tr(id);try{await api('/api/admin/utenti/'+id,{method:'PUT',body:JSON.stringify({username:r.querySelector('.username').value,email:r.querySelector('.email').value,password:r.querySelector('.password').value,admin:r.querySelector('.admin').checked})});notify('Account aggiornato.');await load()}catch(e){notify(e.message,true)}}
async function saveLicense(id){const r=tr(id);try{await api('/api/admin/licenze/'+id,{method:'PUT',body:JSON.stringify({stato:r.querySelector('.status').value,data_scadenza:r.querySelector('.date').value,piano:r.querySelector('.plan').value})});notify('Licenza aggiornata.');await load()}catch(e){notify(e.message,true)}}
async function renew(id){try{await api('/api/admin/licenze/'+id+'/rinnova',{method:'POST'});notify('Licenza rinnovata per un anno.');await load()}catch(e){notify(e.message,true)}}
async function deleteLicense(id){const x=users.find(u=>u.id===id);if(!x||!confirm(`Eliminare la licenza di ${x.username}?\n\nL'accesso verrà bloccato e l'eventuale rinnovo PayPal sarà disattivato.`))return;try{const d=await api('/api/admin/licenze/'+id,{method:'DELETE'});notify(d.message||'Licenza eliminata.');await load()}catch(e){notify(e.message,true)}}
async function deleteUser(id){const x=users.find(u=>u.id===id);if(!x||!confirm(`ELIMINARE DEFINITIVAMENTE L'UTENTE ${x.username}?\n\nVerranno rimossi anche negozio, prodotti, categorie e abbonamento PayPal. Questa operazione non può essere annullata.`))return;const typed=prompt(`Per confermare scrivi ELIMINA`);if(typed!=='ELIMINA')return;try{const d=await api('/api/admin/utenti/'+id,{method:'DELETE'});notify(d.message||'Utente eliminato.');await load()}catch(e){notify(e.message,true)}}
async function setupBasePayPal(){const button=document.getElementById('setupBasePayPal');button.disabled=true;button.textContent='Configurazione…';try{const d=await api('/api/admin/paypal/piano-base',{method:'POST'});notify(d.existing?'Offerta Base PayPal globale già configurata.':'Offerta Base PayPal globale creata e attivata.');renderBasePayPalStatus(true)}catch(e){notify(e.message,true);button.disabled=false;button.textContent='Configura offerta Base PayPal'}}
async function setupAnnualPayPalPlans(){const button=document.getElementById('setupAnnualPayPal');if(!confirm('Creare su PayPal i piani Base e Professional annuali senza trial? I nuovi clienti saranno addebitati subito dopo i 14 giorni di prova locale.'))return;button.disabled=true;button.textContent='Creazione…';try{await api('/api/admin/paypal/piani-annuali',{method:'POST'});notify('Piani PayPal annuali senza trial creati e attivati.')}catch(e){notify(e.message,true);button.disabled=false;button.textContent='Crea piani annuali senza trial'}}
function renderBasePayPalStatus(configured){const action=document.getElementById('basePayPalAction');action.innerHTML=configured?'<span class="badge ok" style="font-size:.86rem;padding:10px 13px">✓ Offerta Base PayPal configurata</span>':'<button class="primary" id="setupBasePayPal" onclick="setupBasePayPal()">Configura offerta Base PayPal</button>'}
async function loadBasePayPalStatus(){try{const d=await api('/api/admin/paypal/piano-base');renderBasePayPalStatus(d.configured)}catch(e){document.getElementById('basePayPalAction').textContent='Stato non disponibile'}}
document.querySelector('.wrap').insertAdjacentHTML('afterbegin','<section class="panel"><div class="top"><div><h2 style="margin:0 0 6px">Configurazione globale PayPal</h2><div style="color:var(--muted)">Questa azione non è riferita a un cliente. La prova Professional dura 14 giorni nell’app; poi i nuovi piani annuali PayPal addebitano subito, senza un secondo trial.</div></div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div id="basePayPalAction"><span style="color:var(--muted)">Verifica offerta…</span></div><button class="primary" id="setupAnnualPayPal" onclick="setupAnnualPayPalPlans()">Crea piani annuali senza trial</button></div></div></section>');
loadBasePayPalStatus();load();
</script></body></html>
