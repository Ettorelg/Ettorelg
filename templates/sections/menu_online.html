<style>.combined-tabs{display:flex;gap:10px;margin-bottom:16px;padding:6px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.025)}.combined-tab{flex:1;border:1px solid transparent;border-radius:10px;padding:12px;background:transparent;color:#aab4d6;font-weight:750;cursor:pointer}.combined-tab[data-combined="qrcode"]{flex:1.4;border-color:rgba(255,196,85,.55);background:rgba(255,196,85,.15);color:#ffe3a3;font-size:1.05rem}.combined-tab.active{background:rgba(110,168,254,.18);border-color:rgba(110,168,254,.5);color:#fff}.combined-tab[data-combined="qrcode"].active{background:#e8ac3f;border-color:#ffd27b;color:#182338;box-shadow:0 7px 22px rgba(232,172,63,.22)}.combined-pane{min-height:260px}.combined-loading{color:#aab4d6;padding:18px}@media(max-width:560px){.combined-tabs{gap:6px}.combined-tab{padding:10px 8px;font-size:.88rem}.combined-tab[data-combined="qrcode"]{font-size:.94rem}}</style>
<div class="combined-tabs" role="group" aria-label="Strumenti del menu pubblico"><button class="combined-tab active" data-combined="qrcode" type="button">▦ QR Code del menu</button><button class="combined-tab" data-combined="anteprima" type="button">Anteprima menu</button></div><div class="combined-pane" id="combinedPane"><div class="combined-loading">Caricamento…</div></div>
<script>
(async()=>{const pane=document.getElementById('combinedPane'),buttons=[...document.querySelectorAll('[data-combined]')];async function openPart(section,button){buttons.forEach(x=>x.classList.toggle('active',x===button));pane.innerHTML='<div class="combined-loading">Caricamento…</div>';const r=await fetch('/dashboard_user/section/'+section,{headers:{'X-Requested-With':'fetch'}});if(!r.ok){pane.innerHTML='<div class="error">Impossibile caricare la sezione.</div>';return}pane.innerHTML=await r.text();for(const old of pane.querySelectorAll('script')){const script=document.createElement('script');if(old.src)script.src=old.src;else script.textContent='(()=>{'+old.textContent+'\n})();';document.body.appendChild(script);script.remove()}}buttons.forEach(b=>b.onclick=()=>openPart(b.dataset.combined,b));await openPart('qrcode',buttons[0])})();
</script>
