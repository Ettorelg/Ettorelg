<style>
  .store-card{max-width:980px;padding:22px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.035)}
  .store-card h2{margin:0 0 8px}.store-card p{color:#aab4d6;line-height:1.5}
  .store-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}
  .store-field{display:flex;flex-direction:column;gap:7px}.store-field.full{grid-column:1/-1}
  .store-field label{font-size:.85rem;font-weight:650}
  .store-field input,.store-field textarea{padding:11px 12px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.05);color:#e7ecff;font:inherit}
  .store-field textarea{min-height:94px;resize:vertical}
  .store-actions{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
  .store-save{border:1px solid rgba(110,168,254,.4);border-radius:12px;padding:10px 14px;background:rgba(110,168,254,.18);color:#e7ecff;font:600 .9rem system-ui;cursor:pointer}
  .store-message{color:#aab4d6;font-size:.88rem}.store-error{border-color:#ff8a8a!important}
  @media(max-width:640px){.store-grid{grid-template-columns:1fr}}
</style>

<section class="store-card">
  <h2>Dati del punto vendita</h2>
  <p>Inserisci le informazioni principali che saranno utilizzate nel tuo menù e nella pagina del locale.</p>

  <form id="storeForm">
    <div class="store-grid">
      <div class="store-field"><label for="nome">Nome Punto Vendita *</label><input id="nome" data-store-field required maxlength="120" /></div>
      <div class="store-field"><label for="indirizzo">Indirizzo *</label><input id="indirizzo" data-store-field required maxlength="160" /></div>
      <div class="store-field"><label for="citta">Città *</label><input id="citta" data-store-field required maxlength="100" /></div>
      <div class="store-field"><label for="cap">CAP *</label><input id="cap" data-store-field required maxlength="12" inputmode="numeric" /></div>
      <div class="store-field"><label for="provincia">Provincia *</label><input id="provincia" data-store-field required maxlength="80" /></div>
      <div class="store-field"><label for="nazione">Nazione</label><input id="nazione" data-store-field maxlength="80" placeholder="Es. Italia" /></div>
      <div class="store-field"><label for="email">Email</label><input id="email" data-store-field type="email" maxlength="160" /></div>
      <div class="store-field"><label for="telefono">Telefono</label><input id="telefono" data-store-field type="tel" maxlength="40" /></div>
      <div class="store-field full"><label for="descrizione_breve">Descrizione Breve *</label><textarea id="descrizione_breve" data-store-field required maxlength="300" placeholder="Una breve presentazione del locale."></textarea></div>
      <div class="store-field full"><label for="descrizione_estesa">Descrizione Estesa *</label><textarea id="descrizione_estesa" data-store-field required maxlength="3000" placeholder="Racconta la storia, la proposta e l'atmosfera del tuo punto vendita."></textarea></div>
    </div>
    <div class="store-actions">
      <button class="store-save" type="submit">Salva informazioni</button>
      <span class="store-message" id="storeMessage" role="status"></span>
    </div>
  </form>
</section>

<script>
  const storeForm = document.getElementById("storeForm");
  const storeMessage = document.getElementById("storeMessage");
  const storeFields = [...document.querySelectorAll("[data-store-field]")];

  async function loadStore(){
    const res = await fetch("/api/negozio");
    if (!res.ok) { storeMessage.textContent = "Impossibile caricare i dati del punto vendita."; return; }
    const data = await res.json();
    if (data.item) {
      storeFields.forEach(field => field.value = data.item[field.id] || "");
      storeMessage.textContent = "Informazioni caricate.";
    }
  }

  storeForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    storeFields.forEach(field => field.classList.remove("store-error"));
    const payload = Object.fromEntries(storeFields.map(field => [field.id, field.value.trim()]));
    const res = await fetch("/api/negozio", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      storeMessage.textContent = "Informazioni del punto vendita salvate.";
      return;
    }
    (data.fields || []).forEach(id => document.getElementById(id)?.classList.add("store-error"));
    storeMessage.textContent = data.detail || data.error || "Errore nel salvataggio.";
  });

  loadStore();
</script>
