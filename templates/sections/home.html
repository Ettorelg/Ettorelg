<style>
  .home-dashboard{display:grid;gap:18px;color:#e7ecff}
  .home-hero{padding:24px;border:1px solid rgba(128,161,255,.3);border-radius:18px;background:linear-gradient(130deg,rgba(51,88,160,.42),rgba(18,31,55,.3))}
  .home-hero h2{margin:0;font-size:clamp(1.35rem,3vw,1.8rem)}.home-hero p{margin:8px 0 0;color:#c8d4f6;line-height:1.5}
  .home-section-title{margin:4px 0 -4px;font-size:.9rem;color:#aab4d6;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .quick-action{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) 26px;align-items:center;gap:13px;width:100%;min-height:94px;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(255,255,255,.035);color:#e7ecff;text-align:left;cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease}
  .quick-action:hover{transform:translateY(-2px);background:rgba(255,255,255,.08);border-color:rgba(142,176,255,.45)}.quick-action:focus-visible{outline:3px solid rgba(110,168,254,.42);outline-offset:2px}
  .quick-action.primary{background:linear-gradient(135deg,rgba(91,132,238,.24),rgba(63,94,172,.13));border-color:rgba(110,168,254,.36)}
  .action-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:13px;background:rgba(117,151,235,.2);font-size:1.35rem}.action-copy strong,.action-copy span{display:block}.action-copy strong{font-size:1rem}.action-copy span{margin-top:4px;color:#aab4d6;font-size:.82rem;line-height:1.35}.action-arrow{font-size:1.15rem;color:#8fb9ff;text-align:right}
  .home-tip{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid rgba(255,210,106,.25);border-radius:14px;background:rgba(255,188,67,.08)}.home-tip .tip-icon{font-size:1.25rem}.home-tip strong{display:block;margin-bottom:4px}.home-tip p{margin:0;color:#d5d9e5;font-size:.9rem;line-height:1.5}
  @media(max-width:700px){.quick-actions{grid-template-columns:1fr}.quick-action{min-height:86px;padding:14px}}
</style>

<section class="home-dashboard" aria-label="Riepilogo del menu">
  <div class="home-hero"><h2>Benvenuto, {{ username }}</h2><p>Da qui puoi preparare e tenere aggiornato il menu digitale del tuo locale.</p></div>
  <h3 class="home-section-title">Azioni rapide</h3>
  <div class="quick-actions">
    <button class="quick-action primary" type="button" onclick="loadSection('attivita')"><span class="action-icon">🏪</span><span class="action-copy"><strong>Negozio e orari</strong><span>Logo, contatti, coperto e orari di apertura.</span></span><span class="action-arrow">›</span></button>
    <button class="quick-action" type="button" onclick="loadSection('categorie')"><span class="action-icon">📁</span><span class="action-copy"><strong>Categorie</strong><span>Organizza le sezioni del tuo menu.</span></span><span class="action-arrow">›</span></button>
    <button class="quick-action" type="button" onclick="loadSection('prodotti')"><span class="action-icon">🧾</span><span class="action-copy"><strong>Prodotti</strong><span>Inserisci e modifica piatti, prezzi e allergeni.</span></span><span class="action-arrow">›</span></button>
    <button class="quick-action" type="button" onclick="loadSection('menu_online')"><span class="action-icon">📱</span><span class="action-copy"><strong>Menu pubblico e QR Code</strong><span>Controlla l’anteprima, stampa o condividi il menu.</span></span><span class="action-arrow">›</span></button>
  </div>
  <div class="home-tip"><span class="tip-icon">💡</span><div><strong>Ordine consigliato</strong><p>Completa il negozio, crea le categorie, aggiungi i prodotti e controlla il menu pubblico prima di condividerlo.</p></div></div>
</section>
