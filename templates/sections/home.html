<style>
  .home-dashboard{display:grid;gap:18px;color:#e7ecff}
  .home-hero{padding:24px;border:1px solid rgba(128,161,255,.3);border-radius:16px;background:linear-gradient(130deg,rgba(51,88,160,.42),rgba(18,31,55,.3))}
  .home-hero h2{margin:0;font-size:clamp(1.35rem,3vw,1.8rem)}
  .home-hero p{margin:8px 0 0;color:#c8d4f6;line-height:1.5}
  .home-section-title{margin:4px 0 -4px;font-size:.9rem;color:#aab4d6;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}
  .quick-action{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.035);color:#e7ecff;text-align:left;cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease}
  .quick-action:hover{transform:translateY(-2px);background:rgba(255,255,255,.08);border-color:rgba(142,176,255,.45)}
  .quick-action .action-icon{display:grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:rgba(117,151,235,.2);font-size:1.2rem}
  .quick-action strong,.quick-action span{display:block}
  .quick-action strong{font-size:.95rem}
  .quick-action span{margin-top:3px;color:#aab4d6;font-size:.8rem;line-height:1.35}
  .home-tip{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid rgba(255,210,106,.25);border-radius:14px;background:rgba(255,188,67,.08)}
  .home-tip .tip-icon{font-size:1.25rem}
  .home-tip strong{display:block;margin-bottom:4px}
  .home-tip p{margin:0;color:#d5d9e5;font-size:.9rem;line-height:1.5}
</style>

<section class="home-dashboard" aria-label="Riepilogo del menu">
  <div class="home-hero">
    <h2>Benvenuto, {{ username }}</h2>
    <p>Da qui puoi preparare e tenere aggiornato il menu digitale del tuo locale.</p>
  </div>

  <h3 class="home-section-title">Azioni rapide</h3>
  <div class="quick-actions">
    <button class="quick-action" type="button" onclick="loadSection('prodotti')">
      <span class="action-icon">🧾</span>
      <span><strong>Gestisci prodotti</strong><span>Aggiungi o modifica i piatti del menu.</span></span>
    </button>
    <button class="quick-action" type="button" onclick="loadSection('categorie')">
      <span class="action-icon">📁</span>
      <span><strong>Organizza categorie</strong><span>Ordina il menu in modo chiaro.</span></span>
    </button>
    <button class="quick-action" type="button" onclick="loadSection('negozio')">
      <span class="action-icon">🏪</span>
      <span><strong>Completa il negozio</strong><span>Aggiorna logo, contatti e descrizione.</span></span>
    </button>
    <button class="quick-action" type="button" onclick="loadSection('qrcode')">
      <span class="action-icon">🔳</span>
      <span><strong>Apri il QR Code</strong><span>Condividi il menu con i tuoi clienti.</span></span>
    </button>
  </div>

  <div class="home-tip">
    <span class="tip-icon">💡</span>
    <div>
      <strong>Per iniziare</strong>
      <p>Crea le categorie, aggiungi i prodotti e controlla l'anteprima del menu prima di condividerlo.</p>
    </div>
  </div>
</section>
