<style>
.customers-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.customers-head h2{margin:0;font-size:1.25rem}.customers-head p{margin:3px 0 0;font-size:.82rem;color:#aab4d6}.customers-search{display:flex;gap:6px;flex-wrap:wrap}.customers-search input{min-width:220px;padding:8px 10px;border:1px solid #58769c;border-radius:8px;background:#14233a;color:#fff}.customers-search button{padding:8px 12px;border:1px solid #72a6e4;border-radius:8px;background:#24558d;color:#fff;font-weight:800;cursor:pointer}.customers-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:11px 0}.customers-metric,.customer-card{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.045)}.customers-metric{font-size:.82rem}.customers-metric strong{display:inline-block;margin-left:7px;font-size:1.25rem}.customers-list{display:grid;gap:7px}.customer-card-head{display:flex;justify-content:space-between;gap:8px}.customer-card h3{margin:0 0 2px;font-size:1rem}.customer-contact{font-size:.8rem;color:#c7d6ec}.customer-contact a{color:#a9ceff}.customer-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:8px}.customer-stats span{padding:6px 7px;border-radius:7px;background:#172a45;font-size:.72rem}.customer-stats b{display:block;margin-top:2px;font-size:.86rem}.customer-card>small{display:block;margin-top:6px;font-size:.7rem;color:#9eabc4}.customer-delete{align-self:start;border:1px solid #a75b64;border-radius:7px;background:#5b2530;color:#fff;padding:5px 8px;font-size:.75rem;cursor:pointer}.customers-status{min-height:16px;margin:4px 0;font-size:.78rem;color:#b9e5c5}@media(max-width:850px){.customer-stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.customers-metrics{grid-template-columns:1fr}.customer-stats{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="customers-head"><div><h2>Clienti memorizzati</h2><p>Rubrica e risultati degli ordini associati al numero di telefono.</p></div><form id="customersSearch" class="customers-search"><input id="customersQuery" type="search" maxlength="80" placeholder="Cerca nome, telefono o email"><button type="submit">Cerca</button></form></div>
<div class="customers-metrics"><div class="customers-metric">Clienti trovati<strong id="customersTotal">—</strong></div><div class="customers-metric">Clienti con ordini<strong id="customersActive">—</strong></div><div class="customers-metric">Valore complessivo richieste<strong id="customersValue">—</strong></div></div>
<p id="customersStatus" class="customers-status" role="status"></p><div id="customersList" class="customers-list"></div>
<script>
(()=>{const form=document.getElementById('customersSearch'),query=document.getElementById('customersQuery'),status=document.getElementById('customersStatus'),list=document.getElementById('customersList'),money=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}),number=new Intl.NumberFormat('it-IT',{maximumFractionDigits:3});
const node=(parent,tag,text,cls)=>{const item=document.createElement(tag);if(text!=null)item.textContent=text;if(cls)item.className=cls;parent.append(item);return item};
async function load(){status.textContent='Caricamento clienti…';list.replaceChildren();try{const response=await fetch('/api/clienti/statistiche?q='+encodeURIComponent(query.value.trim()),{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Caricamento non riuscito.');document.getElementById('customersTotal').textContent=data.totale;document.getElementById('customersActive').textContent=data.con_ordini;document.getElementById('customersValue').textContent=money.format(Number(data.valore_totale));if(!data.clienti.length)node(list,'p','Nessun cliente memorizzato.');for(const customer of data.clienti){const card=node(list,'article',null,'customer-card'),head=node(card,'div',null,'customer-card-head'),identity=node(head,'div');node(identity,'h3',customer.nome);const contact=node(identity,'div',null,'customer-contact');const phone=node(contact,'a',customer.telefono);phone.href='tel:'+customer.telefono.replace(/[^+\d]/g,'');if(customer.email){contact.append(' · ');const email=node(contact,'a',customer.email);email.href='mailto:'+customer.email}const remove=node(head,'button','Elimina','customer-delete');remove.type='button';remove.onclick=async()=>{if(!confirm('Eliminare '+customer.nome+' dalla rubrica? Gli ordini storici resteranno conservati.'))return;remove.disabled=true;const response=await fetch('/api/ordini/clienti/'+customer.id,{method:'DELETE'}),result=await response.json();if(!response.ok){status.textContent=result.error||'Eliminazione non riuscita.';remove.disabled=false;return}load()};const stats=node(card,'div',null,'customer-stats');for(const [label,value] of [['Ordini',customer.ordini],['Evasi',customer.evasi],['Valore',money.format(Number(customer.valore))],['Media ordine',money.format(Number(customer.media))],['Preferito',customer.prodotto_preferito+(customer.quantita_preferita!=='0'?' · '+number.format(Number(customer.quantita_preferita)):'')]]){const box=node(stats,'span',label);node(box,'b',value)}node(card,'small','Ultimo ordine: '+(customer.ultimo_ordine||'nessuno')+' · Scheda aggiornata: '+customer.aggiornato_il)}status.textContent=data.totale+' clienti visualizzati.'}catch(error){status.textContent=error.message}}
form.onsubmit=event=>{event.preventDefault();load()};load()})();
</script>
