<style>
.variants{max-width:980px;margin:auto}.variants-head{position:sticky;top:10px;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-4px 0 14px;padding:12px 14px;border:1px solid #405575;border-radius:14px;background:rgba(15,26,46,.96);box-shadow:0 10px 28px rgba(0,0,0,.3);backdrop-filter:blur(10px)}.variants-head h2{margin:0}.variants-head-actions{display:flex;gap:9px;flex-wrap:wrap}.variant-card{padding:16px;margin:12px 0;border:1px solid #405575;border-radius:14px;background:#18253b}.variant-card>p{margin:7px 0 12px;color:#b9c8df}.variant-row{padding:14px;margin:10px 0;border:1px solid #526784;border-radius:12px;background:rgba(8,17,31,.18)}.variant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.variant-grid label{display:grid;gap:6px}.variant-grid input,.variant-grid select,.variant-prices input{min-height:40px;padding:8px;border:1px solid #7183a1;border-radius:9px;background:#101d31;color:#fff}.variant-products-wrap{grid-column:1/-1}.product-picker{display:grid;gap:9px;max-height:330px;overflow:auto;padding:10px;border:1px solid #526784;border-radius:11px;background:#101d31}.product-category{border:1px solid rgba(255,255,255,.13);border-radius:10px;overflow:hidden;background:#16253c}.product-category-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;background:#203451}.product-category-head strong{font-size:.92rem}.select-category{padding:6px 9px!important;min-height:32px!important;border:1px solid #7297cc!important;border-radius:7px!important;background:#244f82!important;color:#fff;font-size:.78rem;font-weight:800;cursor:pointer}.product-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.product-option{display:flex!important;grid-template-columns:none!important;align-items:center;gap:8px;min-width:0;padding:9px 10px;border-top:1px solid rgba(255,255,255,.08);cursor:pointer}.product-option:hover{background:rgba(110,168,254,.09)}.product-option input{min-height:auto!important;width:17px;height:17px;flex:0 0 auto;accent-color:#6ea8fe}.product-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.86rem}.variant-prices{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.variant-prices label{display:grid;gap:5px;width:140px;font-size:.87rem}.variant-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.variant-actions{display:flex;gap:9px;flex-wrap:wrap}.variant-actions button,.variants-head button{padding:9px 13px;border:1px solid #7297cc;border-radius:9px;background:#244f82;color:#fff;font-weight:800;cursor:pointer}.variant-actions .danger{background:#6d2835;border-color:#a75b64}.primary-save{background:#167044!important;border-color:#54c985!important}.variant-empty{padding:16px;text-align:center;color:#aab4d6}.variant-fraction-row{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.variant-fraction-row label{display:flex;align-items:center;gap:5px}#variantMessage{min-height:20px;margin:9px 2px 0;color:#a9efc5}
@media(max-width:780px){.product-options{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.variants-head{position:static;align-items:flex-start;flex-direction:column}.variants-head-actions{width:100%}.variants-head-actions button{flex:1}.variant-grid,.product-options{grid-template-columns:1fr}.variant-products-wrap{grid-column:auto}.variant-footer{align-items:flex-start;flex-direction:column}}
</style>
<section class="variants">
  <div class="variants-head"><h2>Varianti</h2><div class="variants-head-actions"><button id="variantAdd" type="button">+ Nuova variante</button><button id="variantSave" class="primary-save" type="button">Salva varianti</button></div></div>
  <p>Configura aggiunte e supplementi una sola volta. Puoi applicarli a un’intera categoria oppure ai singoli prodotti selezionati.</p>
  <div class="variant-card"><strong>Divisione dei gusti</strong><p>Per ogni formato scegli le divisioni ammesse. Il prodotto resta sempre intero e le quote devono totalizzare 1.</p><div id="variantFractions"></div></div>
  <div class="variant-card"><strong>Aggiunte e varianti</strong><div id="variantRows"></div><p id="variantMessage" role="status"></p></div>
</section>
<script>
(()=>{
const rows=document.getElementById('variantRows'),fractionsBox=document.getElementById('variantFractions'),message=document.getElementById('variantMessage');let categories=[],products=[],formats=[],fractions=[];
function productPicker(targets){const picker=document.createElement('div');picker.className='product-picker';categories.forEach(category=>{const matches=products.filter(product=>product.id_categoria===category.id);if(!matches.length)return;const group=document.createElement('div');group.className='product-category';const head=document.createElement('div');head.className='product-category-head';const title=document.createElement('strong');title.textContent=category.nome;const toggle=document.createElement('button');toggle.type='button';toggle.className='select-category';toggle.textContent='Seleziona tutti';const options=document.createElement('div');options.className='product-options';matches.forEach(product=>{const label=document.createElement('label');label.className='product-option';const input=document.createElement('input');input.type='checkbox';input.className='v-product';input.value=product.id;input.checked=targets.includes(Number(product.id));const name=document.createElement('span');name.textContent=product.nome;label.append(input,name);options.append(label)});const sync=()=>{const checks=[...options.querySelectorAll('.v-product')],all=checks.length&&checks.every(input=>input.checked);toggle.textContent=all?'Deseleziona tutti':'Seleziona tutti';toggle.setAttribute('aria-pressed',String(Boolean(all)))};toggle.onclick=()=>{const checks=[...options.querySelectorAll('.v-product')],select=!checks.every(input=>input.checked);checks.forEach(input=>input.checked=select);sync()};options.addEventListener('change',sync);head.append(title,toggle);group.append(head,options);picker.append(group);sync()});if(!picker.children.length)picker.innerHTML='<div class="variant-empty">Nessun prodotto disponibile.</div>';return picker}
function addRow(item={nome:'',id_categoria:null,id_prodotto:null,id_prodotti:[],prezzi:{},disponibile:true}){const row=document.createElement('div');row.className='variant-row';const targets=(item.id_prodotti?.length?item.id_prodotti:(item.id_prodotto?[item.id_prodotto]:[])).map(Number);row.innerHTML='<div class="variant-grid"><label>Nome variante<input class="v-name" maxlength="80" placeholder="Es. Mozzarella extra"></label><label>Collegamento<select class="v-scope"><option value="category">Intera categoria</option><option value="products">Singoli prodotti</option></select></label><label class="v-category-wrap">Categoria<select class="v-category"><option value="">Scegli categoria</option></select></label><div class="variant-products-wrap"><strong>Prodotti da collegare</strong></div></div><div class="variant-prices"></div><div class="variant-footer"><label><input class="v-active" type="checkbox"> Disponibile</label><div class="variant-actions"><button class="danger v-remove" type="button">Rimuovi</button></div></div>';
row.querySelector('.v-name').value=item.nome;categories.forEach(c=>row.querySelector('.v-category').add(new Option(c.nome,c.id)));row.querySelector('.variant-products-wrap').append(productPicker(targets));const scope=item.id_categoria?'category':'products';row.querySelector('.v-scope').value=scope;row.querySelector('.v-category').value=item.id_categoria||'';row.querySelector('.v-active').checked=item.disponibile!==false;formats.forEach(format=>{const label=document.createElement('label');label.textContent=format+' € (opzionale)';const input=document.createElement('input');input.type='number';input.min='0';input.max='1000';input.step='.01';input.dataset.format=format;input.value=item.prezzi?.[format]??'';label.append(input);row.querySelector('.variant-prices').append(label)});const sync=()=>{const category=row.querySelector('.v-scope').value==='category';row.querySelector('.v-category-wrap').hidden=!category;row.querySelector('.variant-products-wrap').hidden=category};row.querySelector('.v-scope').onchange=sync;sync();row.querySelector('.v-remove').onclick=()=>row.remove();rows.prepend(row);row.querySelector('.v-name').focus()}
function renderFractions(){fractionsBox.replaceChildren();formats.forEach(format=>{const saved=fractions.find(f=>f.formato===format)?.tagli||[];const line=document.createElement('div');line.className='variant-row variant-fraction-row';line.dataset.format=format;line.append(Object.assign(document.createElement('strong'),{textContent:format+' · '}));[2,3,4].forEach(n=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=n;input.checked=saved.includes(n);label.append(input,document.createTextNode(n===2?' metà':n===3?' terzi':' quarti'));line.append(label)});fractionsBox.append(line)})}
fetch('/api/pizzeria/varianti',{cache:'no-store'}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error||'Caricamento non riuscito');categories=data.categorie;products=data.prodotti;formats=data.formati;fractions=data.frazioni;renderFractions();data.aggiunte.forEach(addRow);if(!data.aggiunte.length)rows.innerHTML='<div class="variant-empty">Nessuna variante configurata. Premi “+ Nuova variante” per iniziare.</div>'}).catch(e=>message.textContent=e.message);
document.getElementById('variantAdd').onclick=()=>{rows.querySelector('.variant-empty')?.remove();addRow()};document.getElementById('variantSave').onclick=async()=>{const button=document.getElementById('variantSave');const frazioni=[...fractionsBox.children].map(row=>({formato:row.dataset.format,tagli:[...row.querySelectorAll('input:checked')].map(i=>Number(i.value))}));const aggiunte=[...rows.querySelectorAll('.variant-row')].map(row=>{const category=row.querySelector('.v-scope').value==='category',prezzi={};row.querySelectorAll('[data-format]').forEach(i=>{if(i.value!=='')prezzi[i.dataset.format]=i.value});return{nome:row.querySelector('.v-name').value.trim(),id_categoria:category?Number(row.querySelector('.v-category').value):null,id_prodotto:null,id_prodotti:category?[]:[...row.querySelectorAll('.v-product:checked')].map(i=>Number(i.value)),prezzi,disponibile:row.querySelector('.v-active').checked}});button.disabled=true;message.textContent='Salvataggio…';try{const response=await fetch('/api/pizzeria/varianti',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({frazioni,aggiunte})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Salvataggio non riuscito');message.textContent='Varianti salvate.'}catch(e){message.textContent=e.message}finally{button.disabled=false}};
})();
</script>
