<style>
  .formats-page{display:grid;gap:12px}.formats-card{padding:14px;border:1px solid #455877;border-radius:12px;background:#18253b}.formats-card h2,.formats-card h3{margin:0 0 7px}.formats-card p{margin:4px 0 10px;color:#b9c8df}.formats-grid{display:grid;gap:9px}.format-category,.stock-group{padding:10px;border:1px solid #405575;border-radius:10px;background:#121f33}.format-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.format-list{display:grid;gap:7px;margin-top:8px}.format-row{display:grid;grid-template-columns:minmax(130px,1fr) 150px auto;gap:8px;align-items:end}.formats-page label{display:grid;gap:5px}.formats-page input,.formats-page select{min-height:40px;padding:8px;border:1px solid #6a7d9d;border-radius:8px;background:#101d31;color:#fff}.formats-page button{padding:9px 13px;border:1px solid #7297cc;border-radius:8px;background:#244f82;color:#fff;font-weight:750;cursor:pointer}.formats-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.inline-check{display:flex!important;align-items:center;gap:7px}.inline-check input,.source-check input,.stock-format-checks input{min-height:auto;width:18px;height:18px}.formats-message{min-height:22px;color:#a9ebc1}.danger{background:#6a2934!important}.taste-sources{margin-top:9px;padding:10px;border:1px solid #354967;border-radius:9px;background:#0e192a}.taste-sources>strong{display:block;margin-bottom:7px}.source-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px}.source-category{padding:8px;border:1px solid #354967;border-radius:8px}.source-check{display:flex!important;align-items:center;gap:7px;font-weight:700}.source-products{display:grid;gap:5px;margin:7px 0 0 25px}.source-products label{display:flex;align-items:center;gap:6px;font-weight:400}.source-category.all-selected .source-products{opacity:.45}.stock-group h4{margin:0}.stock-groups{display:grid;gap:7px;margin-top:8px}.stock-format-row{display:grid;grid-template-columns:minmax(125px,.8fr) minmax(220px,1.6fr) 110px 110px auto;gap:8px;align-items:end;padding:8px;border-radius:8px;background:#182942}.stock-format-checks{display:flex!important;gap:6px 12px;align-items:center;flex-wrap:wrap;min-height:40px}.stock-format-checks label{display:flex;align-items:center;gap:5px}.stock-format-row .stock-quantity{width:100%}@media(max-width:800px){.format-row,.stock-format-row{grid-template-columns:1fr 1fr}.format-row button,.stock-format-row .danger{grid-column:1/-1}.stock-format-checks{grid-column:1/-1}}
</style>
<section class="formats-page">
  <div class="formats-card"><h2>Formati</h2><p>Collega i formati alle categorie e scegli quali prodotti possono essere usati in “Combina gusti”.</p><div id="formatCategories" class="formats-grid"></div><p id="formatsMessage" class="formats-message" role="status"></p></div>
  <div class="formats-card"><h3>Panette per impasto</h3><p>Crea gruppi come Piccolo, Medio e Grande. Collega a ogni gruppo tutti i formati che devono scaricare la stessa panetta.</p><div id="formatStocks" class="formats-grid"></div><div class="formats-actions"><button id="saveFormatStocks" type="button">Salva panette</button></div><p id="stocksMessage" class="formats-message" role="status"></p></div>
</section>
<script>
(()=>{
  const categoriesBox=document.getElementById('formatCategories'),stocksBox=document.getElementById('formatStocks'),formatsMessage=document.getElementById('formatsMessage'),stocksMessage=document.getElementById('stocksMessage');
  let categories=[],products=[],preparation={impasti:[],panette:[],formati_disponibili:[]};
  const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  function formatRow(name=''){const row=document.createElement('div');row.className='format-row';row.innerHTML=`<label>Formato<input class="format-name" maxlength="80" value="${esc(name)}" placeholder="Es. Singola"></label><span></span><button class="danger" type="button">Rimuovi</button>`;row.querySelector('button').onclick=()=>row.remove();return row}
  function tasteSources(target){const wrap=document.createElement('div');wrap.className='taste-sources';wrap.innerHTML='<strong>Articoli disponibili nella gestione gusti</strong><div class="source-grid"></div>';const grid=wrap.querySelector('.source-grid');categories.forEach(source=>{const sourceProducts=products.filter(product=>Number(product.id_categoria)===Number(source.id)&&product.unita_prezzo==='pezzo');if(!sourceProducts.length)return;const box=document.createElement('div');box.className='source-category';const whole=(target.categorie_gusti||[]).includes(source.id);box.innerHTML=`<label class="source-check"><input class="taste-category" type="checkbox" value="${source.id}" ${whole?'checked':''}> Tutta ${esc(source.nome)}</label><div class="source-products"></div>`;const productBox=box.querySelector('.source-products');sourceProducts.forEach(product=>{const checked=(target.prodotti_gusti||[]).includes(product.id);const label=document.createElement('label');label.innerHTML=`<input class="taste-product" type="checkbox" value="${product.id}" ${checked?'checked':''}> ${esc(product.nome)}`;productBox.append(label)});const categoryInput=box.querySelector('.taste-category');const sync=()=>{box.classList.toggle('all-selected',categoryInput.checked);box.querySelectorAll('.taste-product').forEach(input=>input.disabled=categoryInput.checked)};categoryInput.onchange=sync;sync();grid.append(box)});return wrap}
  function renderCategories(){categoriesBox.replaceChildren();const custom=categories.filter(item=>item.tipo_pizzeria!=='standard');if(!custom.length){categoriesBox.textContent='Nessuna categoria Pizzeria configurata.';return}custom.forEach(category=>{const card=document.createElement('article');card.className='format-category';card.dataset.id=category.id;card.innerHTML=`<div class="format-head"><div><strong>${esc(category.nome)}</strong><br><small>${esc(category.tipo_pizzeria)}</small></div><button class="add-format" type="button">+ Formato</button></div><div class="format-list"></div><label class="inline-check"><input class="combine" type="checkbox" ${category.combina_gusti?'checked':''}> Consenti “Combina gusti”</label><div class="taste-slot"></div><div class="formats-actions"><button class="save-category" type="button">Salva formati di ${esc(category.nome)}</button></div>`;const list=card.querySelector('.format-list');(category.formati||[]).forEach(name=>list.append(formatRow(name)));const sources=tasteSources(category),slot=card.querySelector('.taste-slot'),combine=card.querySelector('.combine');slot.append(sources);const sync=()=>sources.hidden=!combine.checked;combine.onchange=sync;sync();card.querySelector('.add-format').onclick=()=>list.append(formatRow());card.querySelector('.save-category').onclick=()=>saveCategory(category,card);categoriesBox.append(card)})}
  async function saveCategory(category,card){const formati=[...card.querySelectorAll('.format-name')].map(input=>input.value.trim()).filter(Boolean);if(!formati.length){formatsMessage.textContent='Inserisci almeno un formato.';return}const combine=card.querySelector('.combine').checked,categorieGusti=combine?[...card.querySelectorAll('.taste-category:checked')].map(input=>Number(input.value)):[],prodottiGusti=combine?[...card.querySelectorAll('.taste-product:checked:not(:disabled)')].map(input=>Number(input.value)):[];const payload={...category,formati,combina_gusti:combine,categorie_gusti:categorieGusti,prodotti_gusti:prodottiGusti};formatsMessage.textContent='Salvataggio…';const response=await fetch('/api/categorie/'+category.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok){formatsMessage.textContent=data.error||'Salvataggio non riuscito.';return}formatsMessage.textContent='Formati e gusti salvati per '+category.nome+'.';await load()}
  function stockRow(item={nome:'',formati:[],quantita:0,illimitate:false}){const row=document.createElement('div');row.className='stock-format-row';const linked=item.formati?.length?item.formati:[item.formato].filter(Boolean);row.innerHTML=`<label>Nome panetta<input class="stock-name" maxlength="80" value="${esc(item.nome||item.formato||'')}" placeholder="Es. Piccolo"></label><div><small>Scaricata da</small><div class="stock-format-checks"></div></div><label>Quantità<input class="stock-quantity" type="number" min="0" max="100000" step="1" value="${Number(item.quantita)||0}"></label><label class="inline-check"><input class="stock-unlimited" type="checkbox" ${item.illimitate?'checked':''}> Illimitate</label><button class="danger" type="button">Rimuovi</button>`;const checks=row.querySelector('.stock-format-checks');preparation.formati_disponibili.forEach(formatName=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=formatName;input.checked=linked.some(value=>value.toLocaleLowerCase('it')===formatName.toLocaleLowerCase('it'));label.append(input,document.createTextNode(formatName));checks.append(label)});const unlimited=row.querySelector('.stock-unlimited'),quantity=row.querySelector('.stock-quantity');unlimited.onchange=()=>quantity.disabled=unlimited.checked;quantity.disabled=unlimited.checked;row.querySelector('.danger').onclick=()=>row.remove();return row}
  function renderStocks(){stocksBox.replaceChildren();preparation.impasti.filter(item=>item.disponibile).forEach(dough=>{const group=document.createElement('article');group.className='stock-group';group.dataset.dough=dough.nome;group.innerHTML=`<div class="format-head"><h4>${esc(dough.nome)}</h4><button class="add-stock-group" type="button">+ Gruppo panette</button></div><div class="stock-groups"></div>`;const rows=group.querySelector('.stock-groups'),items=(preparation.panette||[]).filter(item=>(item.impasto||'Classico')===dough.nome);items.forEach(item=>rows.append(stockRow(item)));group.querySelector('.add-stock-group').onclick=()=>rows.append(stockRow());stocksBox.append(group)});if(!stocksBox.children.length)stocksBox.textContent='Crea prima almeno un impasto nella sezione Pizzeria.'}
  async function load(){const [categoriesResponse,productsResponse,preparationResponse]=await Promise.all([fetch('/api/categorie_full',{cache:'no-store'}),fetch('/api/prodotti',{cache:'no-store'}),fetch('/api/pizzeria/preparazione',{cache:'no-store'})]);const [categoriesData,productsData,preparationData]=await Promise.all([categoriesResponse.json(),productsResponse.json(),preparationResponse.json()]);if(!categoriesResponse.ok||!productsResponse.ok||!preparationResponse.ok)throw new Error('Configurazione formati non disponibile.');categories=categoriesData.items||[];products=productsData.items||[];preparation=preparationData;renderCategories();renderStocks()}
  document.getElementById('saveFormatStocks').onclick=async()=>{const panette=[];stocksBox.querySelectorAll('.stock-group').forEach(group=>group.querySelectorAll('.stock-format-row').forEach(row=>panette.push({impasto:group.dataset.dough,nome:row.querySelector('.stock-name').value.trim(),formati:[...row.querySelectorAll('.stock-format-checks input:checked')].map(input=>input.value),quantita:Number(row.querySelector('.stock-quantity').value),illimitate:row.querySelector('.stock-unlimited').checked})));if(panette.some(item=>!item.nome||!item.formati.length)){stocksMessage.textContent='Completa il nome e collega almeno un formato a ogni gruppo.';return}stocksMessage.textContent='Salvataggio…';const response=await fetch('/api/pizzeria/preparazione',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({impasti:preparation.impasti,panette})});const data=await response.json().catch(()=>({}));if(!response.ok){stocksMessage.textContent=data.error||'Salvataggio non riuscito.';return}preparation=data;renderStocks();stocksMessage.textContent='Panette salvate.'};
  load().catch(error=>formatsMessage.textContent=error.message);
})();
</script>
