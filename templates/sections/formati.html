<style>
  .formats-page{display:grid;gap:12px}.formats-card{padding:14px;border:1px solid #455877;border-radius:12px;background:#18253b}.formats-card h2,.formats-card h3{margin:0 0 7px}.formats-card p{margin:4px 0 10px;color:#b9c8df}.formats-grid{display:grid;gap:9px}.format-category,.stock-row{padding:10px;border:1px solid #405575;border-radius:10px;background:#121f33}.format-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.format-list{display:grid;gap:7px;margin-top:8px}.format-row,.stock-row{display:grid;grid-template-columns:minmax(130px,1fr) 150px auto;gap:8px;align-items:end}.formats-page label{display:grid;gap:5px}.formats-page input,.formats-page select{min-height:40px;padding:8px;border:1px solid #6a7d9d;border-radius:8px;background:#101d31;color:#fff}.formats-page button{padding:9px 13px;border:1px solid #7297cc;border-radius:8px;background:#244f82;color:#fff;font-weight:750;cursor:pointer}.formats-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.inline-check{display:flex!important;align-items:center;gap:7px}.inline-check input{min-height:auto;width:18px;height:18px}.formats-message{min-height:22px;color:#a9ebc1}.danger{background:#6a2934!important}@media(max-width:650px){.format-row,.stock-row{grid-template-columns:1fr 1fr}.format-row button,.stock-row button{grid-column:1/-1}}
</style>
<section class="formats-page">
  <div class="formats-card">
    <h2>Formati</h2><p>Collega i formati alle categorie. Nei prodotti sceglierai quali abilitare e assegnerai il relativo prezzo.</p>
    <div id="formatCategories" class="formats-grid"></div>
    <p id="formatsMessage" class="formats-message" role="status"></p>
  </div>
  <div class="formats-card">
    <h3>Panette disponibili per formato</h3><p>Associa impasto, formato e quantità disponibile oggi. “Illimitate” evita lo scarico della scorta.</p>
    <div id="formatStocks" class="formats-grid"></div>
    <div class="formats-actions"><button id="addFormatStock" type="button">+ Aggiungi quantità</button><button id="saveFormatStocks" type="button">Salva panette</button></div>
    <p id="stocksMessage" class="formats-message" role="status"></p>
  </div>
</section>
<script>
(()=>{
  const categoriesBox=document.getElementById('formatCategories'),stocksBox=document.getElementById('formatStocks'),formatsMessage=document.getElementById('formatsMessage'),stocksMessage=document.getElementById('stocksMessage');
  let categories=[],preparation={impasti:[],panette:[],formati_disponibili:[]};
  const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  function formatRow(name=''){const row=document.createElement('div');row.className='format-row';row.innerHTML=`<label>Formato<input class="format-name" maxlength="80" value="${esc(name)}" placeholder="Es. Singola"></label><span></span><button class="danger" type="button">Rimuovi</button>`;row.querySelector('button').onclick=()=>row.remove();return row}
  function renderCategories(){categoriesBox.replaceChildren();const custom=categories.filter(item=>item.tipo_pizzeria!=='standard');if(!custom.length){categoriesBox.textContent='Nessuna categoria Pizzeria configurata.';return}custom.forEach(category=>{const card=document.createElement('article');card.className='format-category';card.dataset.id=category.id;card.innerHTML=`<div class="format-head"><div><strong>${esc(category.nome)}</strong><br><small>${esc(category.tipo_pizzeria)}</small></div><button class="add-format" type="button">+ Formato</button></div><div class="format-list"></div><label class="inline-check"><input class="combine" type="checkbox" ${category.combina_gusti?'checked':''}> Consenti “Combina gusti”</label><div class="formats-actions"><button class="save-category" type="button">Salva formati di ${esc(category.nome)}</button></div>`;const list=card.querySelector('.format-list');(category.formati||[]).forEach(name=>list.append(formatRow(name)));card.querySelector('.add-format').onclick=()=>list.append(formatRow());card.querySelector('.save-category').onclick=()=>saveCategory(category,card);categoriesBox.append(card)})}
  async function saveCategory(category,card){const formati=[...card.querySelectorAll('.format-name')].map(input=>input.value.trim()).filter(Boolean);if(!formati.length){formatsMessage.textContent='Inserisci almeno un formato.';return}const payload={...category,formati,combina_gusti:card.querySelector('.combine').checked};formatsMessage.textContent='Salvataggio…';const response=await fetch('/api/categorie/'+category.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok){formatsMessage.textContent=data.error||'Salvataggio non riuscito.';return}formatsMessage.textContent='Formati salvati per '+category.nome+'.';await load()}
  function stockRow(item={impasto:'Classico',formato:'',quantita:0,illimitate:false}){const row=document.createElement('div');row.className='stock-row';const doughs=preparation.impasti.filter(x=>x.disponibile).map(x=>`<option ${x.nome===item.impasto?'selected':''}>${esc(x.nome)}</option>`).join(''),formats=preparation.formati_disponibili.map(x=>`<option ${x===item.formato?'selected':''}>${esc(x)}</option>`).join('');row.innerHTML=`<label>Impasto<select class="stock-dough">${doughs}</select></label><label>Formato<select class="stock-format"><option value="">Scegli</option>${formats}</select></label><label>Quantità<input class="stock-quantity" type="number" min="0" max="100000" step="1" value="${Number(item.quantita)||0}"></label><label class="inline-check"><input class="stock-unlimited" type="checkbox" ${item.illimitate?'checked':''}> Illimitate</label><button class="danger" type="button">Rimuovi</button>`;const unlimited=row.querySelector('.stock-unlimited'),quantity=row.querySelector('.stock-quantity');unlimited.onchange=()=>quantity.disabled=unlimited.checked;quantity.disabled=unlimited.checked;row.querySelector('button').onclick=()=>row.remove();return row}
  function renderStocks(){stocksBox.replaceChildren();preparation.panette.forEach(item=>stocksBox.append(stockRow(item)));if(!stocksBox.children.length)stocksBox.append(stockRow())}
  async function load(){const [categoriesResponse,preparationResponse]=await Promise.all([fetch('/api/categorie_full',{cache:'no-store'}),fetch('/api/pizzeria/preparazione',{cache:'no-store'})]);const [categoriesData,preparationData]=await Promise.all([categoriesResponse.json(),preparationResponse.json()]);if(!categoriesResponse.ok||!preparationResponse.ok)throw new Error('Configurazione formati non disponibile.');categories=categoriesData.items||[];preparation=preparationData;renderCategories();renderStocks()}
  document.getElementById('addFormatStock').onclick=()=>stocksBox.append(stockRow());
  document.getElementById('saveFormatStocks').onclick=async()=>{const panette=[...stocksBox.children].map(row=>({impasto:row.querySelector('.stock-dough').value,formato:row.querySelector('.stock-format').value,quantita:Number(row.querySelector('.stock-quantity').value),illimitate:row.querySelector('.stock-unlimited').checked})).filter(item=>item.formato);stocksMessage.textContent='Salvataggio…';const response=await fetch('/api/pizzeria/preparazione',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({impasti:preparation.impasti,panette})});const data=await response.json().catch(()=>({}));if(!response.ok){stocksMessage.textContent=data.error||'Salvataggio non riuscito.';return}preparation=data;renderStocks();stocksMessage.textContent='Panette salvate.'};
  load().catch(error=>formatsMessage.textContent=error.message);
})();
</script>
