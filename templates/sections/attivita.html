<style>.combined-tabs{display:flex;gap:8px;margin-bottom:16px;padding:6px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.025)}.combined-tab{flex:1;border:1px solid transparent;border-radius:10px;padding:11px;background:transparent;color:#aab4d6;font-weight:750;cursor:pointer}.combined-tab.active{background:rgba(110,168,254,.18);border-color:rgba(110,168,254,.35);color:#e7ecff}.combined-pane{min-height:260px}.combined-loading{color:#aab4d6;padding:18px}</style>
<div class="combined-tabs"><button class="combined-tab active" data-combined="negozio">Informazioni negozio</button><button class="combined-tab" data-combined="orari">Orari di apertura</button></div><div class="combined-pane" id="combinedPane"><div class="combined-loading">Caricamento…</div></div>
<script>
(async()=>{const pane=document.getElementById('combinedPane'),buttons=[...document.querySelectorAll('[data-combined]')];async function openPart(section,button){buttons.forEach(x=>x.classList.toggle('active',x===button));pane.innerHTML='<div class="combined-loading">Caricamento…</div>';const r=await fetch('/dashboard_user/section/'+section,{headers:{'X-Requested-With':'fetch'}});if(!r.ok){pane.innerHTML='<div class="error">Impossibile caricare la sezione.</div>';return}pane.innerHTML=await r.text();for(const old of pane.querySelectorAll('script')){const script=document.createElement('script');if(old.src)script.src=old.src;else script.textContent='(()=>{'+old.textContent+'\n})();';document.body.appendChild(script);script.remove()}}buttons.forEach(b=>b.onclick=()=>openPart(b.dataset.combined,b));await openPart('negozio',buttons[0])})();
</script>
