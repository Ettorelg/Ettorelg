<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="{{ url_for('static', filename='alpha-menu-favicon.png') }}" type="image/png"><title>Nuova password · Alpha Menu</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1220;font-family:Inter,Arial,sans-serif;color:#16324f}.card{width:min(430px,100%);padding:30px;background:#fff;border-radius:18px;box-shadow:0 16px 45px rgba(0,0,0,.3)}img{display:block;width:210px;max-width:70%;margin:0 auto 14px}h1{text-align:center;color:#003366;font-size:24px}label{display:block;font-weight:700;margin-top:14px}input{width:100%;padding:12px;margin-top:6px;border:1px solid #c9d6e2;border-radius:9px;font:inherit}button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:9px;background:#075ec9;color:#fff;font-weight:800}.message{padding:12px;border-radius:9px;background:#eaf8ef;color:#176b38}.error{padding:12px;border-radius:9px;background:#fdebec;color:#a3212c}.back{display:block;text-align:center;margin-top:17px;color:#075ec9;font-weight:700;text-decoration:none}</style></head>
<body><main class="card"><img src="{{ url_for('static', filename='alpha-menu-logo.png') }}" alt="Alpha Menu"><h1>Imposta una nuova password</h1>
{% if success %}<div class="message">Password aggiornata correttamente. Ora puoi accedere.</div><a class="back" href="{{ url_for('login') }}">Vai all’accesso</a>
{% elif invalid %}<div class="error">Il collegamento è scaduto o è già stato utilizzato.</div><a class="back" href="{{ url_for('forgot_password') }}">Richiedi un nuovo collegamento</a>
{% else %}{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">Nuova password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><label for="password_confirm">Conferma password</label><input id="password_confirm" name="password_confirm" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Aggiorna password</button></form>{% endif %}
</main></body></html>
